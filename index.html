  }).join('');
  var tabel = '<div class="kartu"><h3>Rekap '+D.per+(D.area?' — '+esc(D.area):' — semua area')+'</h3>'+
    '<div class="gulir" style="max-height:60vh"><table><thead><tr><th>Periode</th><th class="angka">Rencana m</th><th class="angka">Aktual m</th>'+
    '<th class="angka">Deviasi</th><th class="angka">Capaian</th>'+(adaM2?'<th class="angka">Aktual m²</th>':'')+(adaM3?'<th class="angka">Box m³</th>':'')+(adaB?'<th class="angka">Bongkar m</th>':'')+
    '<th class="angka">Hadir manual</th><th class="angka">Finger</th><th class="angka">Kebutuhan</th><th class="angka">Laporan</th><th class="angka">Foto</th></tr></thead>'+
    '<tbody>'+baris+'</tbody></table></div>'+
    '<div class="mini" style="margin-top:6px">Kehadiran dalam orang-hari. Kebutuhan = jumlah pekerja yang diminta SPK aktif, dihitung pada hari kerja yang tercatat. Meter lari dan m² tidak dijumlahkan.</div></div>';

  // tabel SPK
  var spkD = S.spk.filter(function(s){ return (!D.area || s.area===D.area) && s.status==='Aktif'; });
  var tSpk = '<div class="kartu"><h3>Capaian SPK aktif</h3>'+(spkD.length ?
    '<div class="gulir"><table><thead><tr><th>No SPK / FPK</th><th>Area</th><th style="min-width:200px">Rincian (terpasang / volume)</th><th style="width:150px">Capaian</th><th>Durasi</th></tr></thead><tbody>'+
    spkD.map(function(s){
      var p = s.persen, sisa = s.tglTarget ? selisihTgl(D.acuan, s.tglTarget) : null;
      return '<tr><td><b>'+esc(s.noSPK)+'</b><div class="mini">'+esc(String(s.uraian||'').slice(0,70))+'</div></td><td>'+esc(s.area)+'</td>'+
        '<td class="mini">'+esc(ringkasTeks(s))+'</td>'+
        '<td><b style="color:'+warnaPersen(p)+'">'+teksPersen(p)+'</b>'+batang(p, warnaArea(s.area))+'</td>'+
        '<td class="mini">'+tglIndo(s.tglMulai)+' – '+tglIndo(s.tglTarget)+(sisa!==null?'<br><b style="color:'+(sisa<0&&(p===null||p<100)?'var(--merah)':'var(--arang)')+'">'+(sisa<0?'lewat '+(-sisa)+' hr':'sisa '+sisa+' hr')+'</b>':'')+'</td></tr>';
    }).join('')+'</tbody></table></div>' : '<div class="kosong">Belum ada SPK aktif. Daftarkan di menu SPK.</div>')+'</div>';

  // kepatuhan 7 hari terakhir
  var tujuh = []; for(var i=6;i>=0;i--) tujuh.push(tglTambah(D.acuan,-i));
  function adaDi(arr, t, a){ return arr.filter(function(x){ return x.t===t && x.a===a; }); }
  var kepatuhan = '<div class="kartu"><h3>Kelengkapan input 7 hari terakhir</h3>'+
    '<div class="gulir"><table><thead><tr><th>Area</th>'+tujuh.map(function(t){ return '<th class="c">'+tglPendek(t)+'</th>'; }).join('')+'</tr></thead><tbody>'+
    areas.map(function(a){
      return '<tr><td><b>'+esc(a)+'</b></td>'+tujuh.map(function(t){
        var lap = adaDi(J.laporan,t,a).length, ft = adaDi(J.foto,t,a).length, mn = adaDi(J.manual,t,a).length,
            fg = adaDi(J.finger,t,a).length, pr = adaDi(J.progres,t,a).length + adaDi(J.progresSpk||[],t,a).length;
        var minggu = tglObj(t).getDay()===0 && !lap && !pr && !mn;
        if(minggu) return '<td class="c mini" style="background:#F1F0EE">libur?</td>';
        var skor = (lap?1:0)+(ft?1:0)+(mn?1:0)+(pr?1:0);
        var bg = skor===4 ? '#E6F1E9' : (skor>=2 ? '#FDF6E3' : '#FBEAEA');
        return '<td class="c" style="background:'+bg+';font-size:11.5px;line-height:1.35">'+
          (pr?'✓':'✕')+' progres<br>'+(lap?'✓':'✕')+' laporan<br>'+ft+' foto<br>'+(mn?'✓':'✕')+' absen'+(fg?' · F':'')+'</td>';
      }).join('')+'</tr>';
    }).join('')+'</tbody></table></div>'+
    '<div class="mini" style="margin-top:6px">Hijau = progres, laporan, foto, dan absensi manual lengkap. "F" = data finger sudah diunggah untuk hari itu.</div></div>';

  var grafik =
   '<div class="gridgraf">'+
    '<div class="kartu"><h3>Progres pipa per '+({harian:'hari',mingguan:'minggu',bulanan:'bulan'}[D.per])+' (meter lari)</h3><div class="kanvas"><canvas id="gPipa"></canvas></div></div>'+
    (adaM2 ? '<div class="kartu"><h3>Dinding &amp; HE (m²)</h3><div class="kanvas"><canvas id="gM2"></canvas></div></div>' : '')+
    '<div class="kartu"><h3>Kehadiran (orang-hari)</h3><div class="kanvas"><canvas id="gHadir"></canvas></div></div>'+
    '<div class="kartu"><h3>Capaian vs rencana per area — '+namaPer+'</h3><div class="kanvas"><canvas id="gCapai"></canvas></div></div>'+
    '<div class="kartu"><h3>Faktor penghambat ('+tglIndo(r.dari)+' – '+tglIndo(r.sampai)+')</h3><div class="kanvas"><canvas id="gHambat"></canvas></div></div>'+
   '</div>';

  el('dIsi').innerHTML =
    '<div class="mini" style="margin:0 0 8px">Periode aktif: <b>'+labelBucket(kini)+'</b> · data '+tglIndo(r.dari)+' – '+tglIndo(r.sampai)+'</div>'+
    kpi + kartuArea + grafik + tabel + tSpk + kepatuhan;
  gambarGrafik(H, buckets, areas, kini, adaM2);
}

function gambarGrafik(H, buckets, areas, kini, adaM2){
  if(typeof Chart === 'undefined'){
    [].forEach.call(document.querySelectorAll('.kanvas'), function(k){ k.innerHTML = '<div class="kosong">Grafik tidak termuat (periksa koneksi internet).</div>'; });
    return;
  }
  Object.keys(GRAF).forEach(function(k){ try{ GRAF[k].destroy(); }catch(e){} delete GRAF[k]; });
  Chart.defaults.font.family = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  Chart.defaults.color = '#6B6A66';
  var label = buckets.map(labelBucket);
  var grid = { color:'#ECEAE6' };
  var tip = { mode:'index', intersect:false, callbacks:{ label:function(c){ return ' '+c.dataset.label+': '+f1(c.parsed.y!==undefined?c.parsed.y:c.parsed.x); } } };
  function batangArea(kunci){
    return areas.map(function(a, i){
      return { type:'bar', label:a, data:buckets.map(function(b){ return Math.round(H.A[b][a][kunci]*10)/10; }),
               backgroundColor:warnaArea(a,i), borderColor:'#FFFFFF', borderWidth:{top:0,left:0,right:0,bottom:2},
               borderRadius:4, borderSkipped:'bottom', stack:'s' };
    });
  }
  function garisRencana(kunci){
    return { type:'line', label:'Rencana', data:buckets.map(function(b){ return Math.round(jumlahArea(H.A[b], areas)[kunci]*10)/10; }),
             borderColor:'#2B2B2A', borderWidth:2, borderDash:[5,4], pointRadius:3, pointBackgroundColor:'#2B2B2A', tension:0, stack:'r' };
  }
  var opsiTumpuk = { responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
    plugins:{ legend:{position:'bottom', labels:{boxWidth:12}}, tooltip:tip },
    scales:{ x:{stacked:true, grid:{display:false}}, y:{stacked:true, beginAtZero:true, grid:grid} } };

  GRAF.pipa = new Chart(el('gPipa'), { data:{ labels:label, datasets: batangArea('aM').concat([garisRencana('rM')]) }, options:opsiTumpuk });
  if(adaM2 && el('gM2')) GRAF.m2 = new Chart(el('gM2'), { data:{ labels:label, datasets: batangArea('aM2').concat([garisRencana('rM2')]) }, options:opsiTumpuk });

  var tot = buckets.map(function(b){ return jumlahArea(H.A[b], areas); });
  GRAF.hadir = new Chart(el('gHadir'), {
    data:{ labels:label, datasets:[
      { type:'bar', label:'Manual', data:tot.map(function(t){ return t.manual; }), backgroundColor:'#2F78B5', borderRadius:4, borderSkipped:'bottom' },
      { type:'bar', label:'Finger', data:tot.map(function(t){ return t.finger; }), backgroundColor:'#B07A1A', borderRadius:4, borderSkipped:'bottom' },
      { type:'line', label:'Kebutuhan SPK', data:tot.map(function(t){ return t.keb; }), borderColor:'#B3242C', borderWidth:2, borderDash:[5,4], pointRadius:3, pointBackgroundColor:'#B3242C' }
    ]},
    options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
      plugins:{ legend:{position:'bottom', labels:{boxWidth:12}}, tooltip:tip },
      scales:{ x:{grid:{display:false}}, y:{beginAtZero:true, grid:grid} } }
  });

  GRAF.capai = new Chart(el('gCapai'), {
    type:'bar',
    data:{ labels:areas, datasets:[
      { label:'Rencana (m)', data:areas.map(function(a){ return Math.round(H.A[kini][a].rM*10)/10; }), backgroundColor:'#D9D6D0', borderRadius:4, borderSkipped:'bottom' },
      { label:'Aktual (m)', data:areas.map(function(a){ return Math.round(H.A[kini][a].aM*10)/10; }),
        backgroundColor:areas.map(function(a,i){ return warnaArea(a,i); }), borderRadius:4, borderSkipped:'bottom' }
    ]},
    options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
      plugins:{ legend:{position:'bottom', labels:{boxWidth:12}}, tooltip:tip },
      scales:{ x:{grid:{display:false}}, y:{beginAtZero:true, grid:grid} } }
  });

  var hk = Object.keys(H.hambat).sort(function(a,b){ return H.hambat[b]-H.hambat[a]; });
  if(!hk.length){ el('gHambat').parentNode.innerHTML = '<div class="kosong">Tidak ada hambatan tercatat pada rentang ini.</div>'; return; }
  GRAF.hambat = new Chart(el('gHambat'), {
    type:'bar',
    data:{ labels:hk, datasets:[{ label:'Kejadian', data:hk.map(function(k){ return H.hambat[k]; }), backgroundColor:'#B3242C', borderRadius:4, borderSkipped:'start' }] },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:function(c){ return ' '+c.parsed.x+' kali'; } } } },
      scales:{ x:{beginAtZero:true, ticks:{precision:0}, grid:grid}, y:{grid:{display:false}} } }
  });
}

S.dok = { dari: tglTambah(hariIni(), -6), sampai: hariIni(), area:'' };

function pgDok(){
  var D = S.dok;
  judul('Dokumentasi', 'Foto progres harian tiap area');
  el('isi').innerHTML = v4Peringatan() +
   '<div class="kartu"><div class="baris">'+
     '<div><label>Dari</label><input type="date" id="kDari" value="'+D.dari+'"></div>'+
     '<div><label>Sampai</label><input type="date" id="kSampai" value="'+D.sampai+'"></div>'+
     '<div><label>Area</label><select id="kArea"><option value="">Semua area</option>'+
       S.master.area.map(function(a){ return '<option'+(a===D.area?' selected':'')+'>'+a+'</option>'; }).join('')+'</select></div>'+
     '<div style="flex:0 0 auto"><button class="btn a2" id="kMuat">Tampilkan</button></div>'+
   '</div></div><div id="kIsi"></div>';
  el('kMuat').onclick = function(){ D.dari = el('kDari').value; D.sampai = el('kSampai').value; D.area = el('kArea').value; muatDok(); };

function muatDok(){
  var D = S.dok;
  el('kIsi').innerHTML = '<div class="kosong">Memuat foto…</div>';
  api('v4FotoList',{dari:D.dari, sampai:D.sampai, area:D.area}).then(function(j){
    S.dokData = j.data || []; gambarDok();
  }).catch(function(e){ el('kIsi').innerHTML = '<div class="pesan bad">'+esc(e.message)+'</div>'; });
}

function gambarDok(){
  var D = S.dok, data = S.dokData;
  var areas = D.area ? [D.area] : S.master.area;
  var hari = []; for(var t = D.sampai; t >= D.dari && hari.length < 62; t = tglTambah(t,-1)) hari.push(t);
  function hit(t, a){ return data.filter(function(f){ return f.tanggal===t && f.area===a; }).length; }

  var matriks = '<div class="kartu"><h3>Jumlah foto per hari</h3><div class="gulir"><table><thead><tr><th>Tanggal</th>'+
    areas.map(function(a){ return '<th class="c">'+esc(a)+'</th>'; }).join('')+'</tr></thead><tbody>'+
    hari.map(function(t){
      return '<tr><td>'+tglPendek(t)+'</td>'+areas.map(function(a){
        var n = hit(t,a), libur = tglObj(t).getDay()===0;
        var bg = n>=4 ? '#E6F1E9' : (n>0 ? '#FDF6E3' : (libur ? '#F1F0EE' : '#FBEAEA'));
        return '<td class="c" style="background:'+bg+'"><b>'+n+'</b></td>';
      }).join('')+'</tr>';
    }).join('')+'</tbody></table></div>'+
    '<div class="mini" style="margin-top:6px">Hijau = 4 foto atau lebih · kuning = ada tapi kurang · merah = tidak ada foto di hari kerja.</div></div>';

  if(!data.length){ el('kIsi').innerHTML = matriks + '<div class="kosong">Belum ada foto pada rentang ini.</div>'; return; }

  var grup = '';
  hari.forEach(function(t){
    var hariIniFoto = data.filter(function(f){ return f.tanggal===t; });
    if(!hariIniFoto.length) return;
    grup += '<div class="kartu"><h3>'+tglIndo(t,true)+' <span class="mini">('+hariIniFoto.length+' foto)</span></h3>';
    areas.forEach(function(a, i){
      var fs = hariIniFoto.filter(function(f){ return f.area===a; });
      if(!fs.length) return;
      grup += '<div style="margin:6px 0 4px"><span class="pil" style="background:'+warnaArea(a,i)+';color:#fff">'+esc(a)+'</span></div>'+
        '<div class="galeri">'+fs.map(function(f){
          return '<figure data-dok="'+esc(f.idFoto)+'"><img src="'+fotoSrc(f,500)+'" loading="lazy" alt="'+esc(f.keterangan||'foto')+'">'+
            '<figcaption><b>'+esc(f.idSPK?namaSpk(f.idSPK):'Umum')+'</b> · '+esc(f.keterangan||'—')+'<br><span>'+esc(f.oleh)+'</span></figcaption></figure>';
        }).join('')+'</div>';
    });
    grup += '</div>';
  });
  el('kIsi').innerHTML = matriks + grup;
  el('kIsi').onclick = function(e){
    var f = e.target.closest('[data-dok]'); if(!f) return;
    bukaLightbox(S.dokData, f.dataset.dok);
  };
}

/* ─────────── penampil foto besar ─────────── */
function bukaLightbox(daftar, id){
  var i = Math.max(0, daftar.map(function(f){ return f.idFoto; }).indexOf(id));
  var lb = el('lightbox');
  if(!lb){ lb = document.createElement('div'); lb.id = 'lightbox'; document.body.appendChild(lb); }
  function gambar(){
    var f = daftar[i];
    lb.innerHTML = '<div class="lbisi"><img src="'+fotoSrc(f,1600)+'" alt="">'+
      '<div class="lbket"><b>'+tglIndo(f.tanggal||S.tanggal,true)+' · '+esc(f.area||S.area)+' · '+esc(f.idSPK?namaSpk(f.idSPK):'Umum')+'</b><br>'+
      esc(f.keterangan||'—')+' <span style="opacity:.7">— '+esc(f.oleh||'')+'</span><br>'+
      '<a href="https://drive.google.com/file/d/'+encodeURIComponent(f.fileId)+'/view" target="_blank" rel="noopener" style="color:var(--emas)">Buka berkas asli di Drive</a> · '+(i+1)+' / '+daftar.length+'</div></div>'+
      '<button class="lbtombol" data-lb="-1" style="left:10px">‹</button><button class="lbtombol" data-lb="1" style="right:10px">›</button>'+
      '<button class="lbtombol" data-lb="x" style="top:10px;right:10px;transform:none">×</button>';
  }
  lb.onclick = function(e){
    var b = e.target.closest('[data-lb]');
    if(!b){ if(e.target===lb) lb.remove(); return; }
    if(b.dataset.lb==='x'){ lb.remove(); return; }
    i = (i + (+b.dataset.lb) + daftar.length) % daftar.length; gambar();
  };
  gambar();
}

/* ═══════════════ PENCOCOKAN ABSENSI: FINGER (MINGGUAN) vs MANUAL ═══════════════ */

    '<div class="mini">Finger diunggah seminggu sekali, sedangkan absensi manual diisi pengawas tiap hari di Input harian. '+
    'Di sini keduanya dibandingkan per hari dan per orang, sehingga terlihat siapa yang hadir tapi tidak finger, '+

function muatCocok(){
  var C = S.cocok, dari = C.minggu, sampai = tglTambah(C.minggu, 6);
  el('cIsi').innerHTML = '<div class="kosong">Mencocokkan '+tglIndo(dari)+' – '+tglIndo(sampai)+'…</div>';
  api('v4Dashboard',{dari:dari, sampai:sampai}).then(function(J){ gambarCocok(J, dari); })
    .catch(function(e){ el('cIsi').innerHTML = '<div class="pesan bad">'+esc(e.message)+'</div>'; });
}

function kunciNama(n){ return String(n||'').trim().toUpperCase().replace(/\s+/g,' '); }

function gambarCocok(J, dari){
  var C = S.cocok, hari = [];
  for(var i=0;i<7;i++) hari.push(tglTambah(dari,i));
  var areas = C.area ? [C.area] : S.master.area;
  var adaFingerHari = {}; J.finger.forEach(function(f){ adaFingerHari[f.t] = 1; });
  var selisih = [];

  // ── per area per hari ──
  var ringkas = '<div class="gulir"><table><thead><tr><th>Tanggal</th><th>Area</th>'+
    '<th class="angka">Terdaftar</th><th class="angka">Kebutuhan SPK</th><th class="angka">Hadir manual</th>'+
    '<th class="angka">Hadir finger</th><th class="angka">Selisih</th><th>Keterangan</th></tr></thead><tbody>';
  hari.forEach(function(t){
    areas.forEach(function(a){
      var mn = J.manual.filter(function(m){ return m.t===t && m.a===a && m.s==='Hadir'; }).length;
      var fg = J.finger.filter(function(f){ return f.t===t && f.a===a && /hadir/i.test(f.s); }).length;
      var adaMn = J.manual.some(function(m){ return m.t===t && m.a===a; });
      var namaMn = {}, namaFg = {}, beda = 0;
      J.manual.forEach(function(m){ if(m.t===t && m.a===a && m.s==='Hadir') namaMn[kunciNama(m.n)] = 1; });
      J.finger.forEach(function(f){ if(f.t===t && f.a===a && /hadir/i.test(f.s)) namaFg[kunciNama(f.n)] = 1; });
      Object.keys(namaMn).forEach(function(n){ if(!namaFg[n]) beda++; });
      Object.keys(namaFg).forEach(function(n){ if(!namaMn[n]) beda++; });
      var keb = kebutuhanPekerja(a, t), daftar = karyawanArea(a).length;
      var ket, bg = '';
      if(!adaFingerHari[t] && !adaMn){ ket = tglObj(t).getDay()===0 ? 'Minggu / libur' : 'Belum ada data'; bg = '#F1F0EE'; }
      else if(!adaFingerHari[t]){ ket = 'Finger minggu ini belum diunggah'; bg = '#FDF6E3'; }
      else if(!adaMn && !fg){ ket = 'Tidak ada kehadiran tercatat'; bg = '#F1F0EE'; }
      else if(!adaMn && fg){ ket = 'Absensi manual belum diisi'; bg = '#FDF6E3'; }
      else if(mn===fg && !beda){ ket = 'Cocok'; bg = '#E6F1E9'; }
      else if(mn===fg){ ket = 'Jumlah sama, tapi '+beda+' orang berbeda'; bg = '#FBEAEA'; }
      else { ket = 'Selisih '+Math.abs(mn-fg)+' orang'; bg = '#FBEAEA'; }
      if(keb && adaMn && mn < keb) ket += ' · kurang '+(keb-mn)+' dari kebutuhan';
      ringkas += '<tr style="background:'+bg+'"><td>'+tglPendek(t)+'</td><td>'+esc(a)+'</td>'+
        '<td class="angka">'+daftar+'</td><td class="angka">'+(keb||'—')+'</td>'+
        '<td class="angka"><b>'+(adaMn?mn:'—')+'</b></td><td class="angka"><b>'+(adaFingerHari[t]?fg:'—')+'</b></td>'+
        '<td class="angka">'+(adaMn&&adaFingerHari[t]?(mn-fg>=0?'+':'')+(mn-fg):'—')+'</td><td class="mini">'+ket+'</td></tr>';
    });
  });
  ringkas += '</tbody></table></div>';

  // ── per orang ──
  var orang = {};
  function catat(r, jenis){
    if(C.area && r.a!==C.area) return;
    var k = r.a+'|'+kunciNama(r.n);
    var o = orang[k] || (orang[k] = { a:r.a, n:r.n, hari:{} });
    var h = o.hari[r.t] || (o.hari[r.t] = { m:'', f:'' });
    h[jenis] = r.s;
  }
  J.manual.forEach(function(r){ catat(r,'m'); });
  J.finger.forEach(function(r){ catat(r,'f'); });
  var daftarOrang = Object.keys(orang).map(function(k){ return orang[k]; })
    .sort(function(a,b){ return (a.a+a.n).localeCompare(b.a+b.n); });

  var jmlBeda = 0;
  var perOrang = daftarOrang.map(function(o){
    var beda = 0;
    var sel = hari.map(function(t){
      var h = o.hari[t];
      if(!h) return '<td class="c mini">·</td>';
      var mh = h.m==='Hadir', fh = /hadir/i.test(h.f);
      var kode, bg;
      if(!adaFingerHari[t]){ kode = h.m ? h.m.slice(0,1) : '·'; bg = ''; }
      else if(mh && fh){ kode = '✓'; bg = '#E6F1E9'; }
      else if(mh && !fh){ kode = 'M'; bg = '#FBEAEA'; beda++;
        selisih.push({t:t, a:o.a, n:o.n, m:h.m, f:h.f||'-', k:'Manual hadir, tidak ada finger'}); }
      else if(!mh && fh){ kode = 'F'; bg = '#FDF6E3'; beda++;
        selisih.push({t:t, a:o.a, n:o.n, m:h.m||'-', f:h.f, k:h.m?'Finger hadir, manual '+h.m:'Finger hadir, manual belum diisi'}); }
      else { kode = (h.m||h.f||'-').slice(0,1); bg = ''; }
      return '<td class="c" style="background:'+bg+'" title="Manual: '+esc(h.m||'-')+' · Finger: '+esc(h.f||'-')+'"><b>'+kode+'</b></td>';
    }).join('');
    if(beda) jmlBeda++;
    return { html:'<tr'+(beda?'':' class="cocokok"')+'><td><b>'+esc(o.n)+'</b><div class="mini">'+esc(o.a)+'</div></td>'+sel+'<td class="angka">'+(beda||'')+'</td></tr>', beda:beda };
  });
  S.cocokSelisih = selisih;

  var tblOrang = daftarOrang.length ?
    '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 6px"><b>Per orang</b>'+
      '<span class="mini">'+jmlBeda+' orang punya selisih</span>'+
      '<label style="display:flex;gap:6px;align-items:center;font-weight:400;margin:0 0 0 auto"><input type="checkbox" id="cHanya" style="width:auto" checked> hanya yang berselisih</label></div>'+
    '<div class="gulir" style="max-height:60vh" id="cOrang"><table><thead><tr><th style="min-width:160px">Nama</th>'+
      hari.map(function(t){ return '<th class="c">'+tglPendek(t)+'</th>'; }).join('')+'<th class="angka">Selisih</th></tr></thead><tbody>'+
      perOrang.map(function(x){ return x.html; }).join('')+'</tbody></table></div>'+
    '<div class="mini" style="margin-top:6px">✓ = hadir di keduanya · <b>M</b> = manual hadir tapi tidak ada finger · <b>F</b> = finger ada tapi manual tidak hadir/belum diisi · '+
    'huruf lain = status manual (S sakit, I izin, A alpa, O off, D dinas). Arahkan kursor ke sel untuk melihat detail.</div>'
    : '<div class="kosong">Belum ada absensi manual maupun finger pada minggu ini.</div>';

  el('cIsi').innerHTML = '<div class="mini" style="margin-bottom:6px">Minggu <b>'+tglIndo(dari)+' – '+tglIndo(hari[6])+'</b> · '+
    'finger terunggah untuk <b>'+Object.keys(adaFingerHari).length+'</b> dari 7 hari.</div>' + ringkas + tblOrang;
  function saring(){
    var c = el('cHanya'); if(!c) return;
    [].forEach.call(document.querySelectorAll('#cOrang tr.cocokok'), function(r){ r.style.display = c.checked ? 'none' : ''; });
  }
  if(el('cHanya')){ el('cHanya').onchange = saring; saring(); }
}

function muatRekap(){
  api('rekap',{dari:el('rDari').value, sampai:el('rSampai').value}).then(function(j){
    var A = j.data.perArea, H = j.data.hambat;
    var tot = {rencana:0, aktual:0, rencanaM2:0, aktualM2:0, hadir:0, sket:0};
    Object.keys(A).forEach(function(k){
      tot.rencana+=A[k].rencana; tot.aktual+=A[k].aktual;
      tot.rencanaM2+=n2(A[k].rencanaM2); tot.aktualM2+=n2(A[k].aktualM2);
      tot.hadir+=A[k].hadir; tot.sket+=A[k].sket;
    });
    var dev = tot.aktual - tot.rencana, devM2 = tot.aktualM2 - tot.rencanaM2;

    var html = '<div class="gr2" style="margin-bottom:12px">'+
      '<div class="stat"><b>'+tot.aktual.toFixed(1)+' m</b><span>Pipa terpasang (meter lari)</span></div>'+
      '<div class="stat"><b style="color:'+(dev<0?'var(--merah)':'var(--hijau)')+'">'+(dev>=0?'+':'')+dev.toFixed(1)+' m</b><span>Deviasi pipa</span></div>'+
      '<div class="stat"><b>'+tot.aktualM2.toFixed(1)+' m²</b><span>Dinding, HE &amp; sejenisnya</span></div>'+
      '<div class="stat"><b style="color:'+(devM2<0?'var(--merah)':'var(--hijau)')+'">'+(devM2>=0?'+':'')+devM2.toFixed(1)+' m²</b><span>Deviasi dinding &amp; HE</span></div>'+
      '<div class="stat"><b style="color:'+(tot.sket?'var(--merah)':'var(--hijau)')+'">'+tot.sket+'</b><span>Line masih sket</span></div>'+
      '<div class="stat"><b>'+tot.hadir+'</b><span>Kehadiran tercatat</span></div>'+
    '</div>'+
    '<div class="mini" style="margin-bottom:10px">Meter lari dan m² sengaja tidak dijumlahkan — satuannya berbeda dan harganya di BOQ juga berbeda.</div>';

    html += '<div class="gulir"><table><thead><tr><th>Area</th>'+
      '<th class="angka">Rencana m</th><th class="angka">Aktual m</th><th class="angka">Dev m</th>'+
      '<th class="angka">Rencana m²</th><th class="angka">Aktual m²</th><th class="angka">Dev m²</th>'+
      '<th class="angka">Hadir</th><th class="angka">Line</th><th class="angka">Sket</th><th class="angka">TTD</th></tr></thead><tbody>'+
      Object.keys(A).map(function(k){
        var a=A[k], d=a.aktual-a.rencana, d2=n2(a.aktualM2)-n2(a.rencanaM2);
        function w(x){ return 'color:'+(x<0?'var(--merah)':'var(--hijau)'); }
        return '<tr><td><b>'+k+'</b></td>'+
          '<td class="angka">'+a.rencana.toFixed(1)+'</td><td class="angka">'+a.aktual.toFixed(1)+'</td>'+
          '<td class="angka" style="'+w(d)+'">'+(d>=0?'+':'')+d.toFixed(1)+'</td>'+
          '<td class="angka">'+n2(a.rencanaM2).toFixed(1)+'</td><td class="angka">'+n2(a.aktualM2).toFixed(1)+'</td>'+
          '<td class="angka" style="'+w(d2)+'">'+(d2>=0?'+':'')+d2.toFixed(1)+'</td>'+
          '<td class="angka">'+a.hadir+'</td><td class="angka">'+a.line+'</td><td class="angka">'+a.sket+'</td><td class="angka">'+a.ttdLengkap+'</td></tr>';
      }).join('')+'</tbody></table></div>';

    var kunci = Object.keys(H).sort(function(a,b){return H[b]-H[a];});
    html += '<div class="kartu" style="margin-top:12px"><h3>Faktor penghambat terbanyak</h3>'+
      (kunci.length? '<table>'+kunci.map(function(k){
        return '<tr><td>'+esc(k)+'</td><td class="angka" style="width:70px"><b>'+H[k]+'</b> kali</td></tr>';
      }).join('')+'</table>' : '<div class="mini">Belum ada kendala tercatat pada rentang ini.</div>')+'</div>';

    el('rIsi').innerHTML = html;
  }).catch(function(e){ el('rIsi').innerHTML='<div class="pesan bad">'+esc(e.message)+'</div>'; });
}

function waktuMasuk(t){
  if(!t) return '—';
  var d = new Date(t);
  if(isNaN(d.getTime())) return esc(t);
  return p2(d.getDate())+' '+BULAN[d.getMonth()]+' '+d.getFullYear()+' · '+p2(d.getHours())+':'+p2(d.getMinutes());
}

  judul('Pengguna', 'PIN terlihat di sini — hanya peran manajemen yang bisa membuka halaman ini');
  var P = S.master.pengguna || [];
  var opsiPeran = ['lapangan','manajemen','baca'];
  el('isi').innerHTML =
   '<div class="pesan info">Ubah PIN, peran, atau status langsung di tabel, lalu tekan <b>Simpan</b> di baris itu. '+
   'Ingatkan tim: jangan memakai PIN yang sama dengan ATM atau kunci layar HP.</div>'+

   '<th style="width:100px">Aktif</th><th style="width:150px">Terakhir masuk</th><th style="width:100px"></th></tr></thead><tbody>'+
   P.map(function(u, i){
     return '<tr data-baris="'+i+'"><td><b>'+esc(u.nama)+'</b>'+(u.nama===S.nama?' <span class="mini">(Anda)</span>':'')+'</td>'+

       '<td><select data-u="aktif">'+['YA','TIDAK'].map(function(p){ return '<option'+(p===String(u.aktif||'YA').toUpperCase()?' selected':'')+'>'+p+'</option>'; }).join('')+'</select></td>'+
       '<td class="mini">'+waktuMasuk(u.terakhirMasuk)+'</td>'+
       '<td><button class="btn kecil" data-simpanu="'+i+'">Simpan</button></td></tr>';
   }).join('')+'</tbody></table></div>'+
   '<div class="kartu" style="margin-top:12px"><h3>Tambah pengguna baru</h3><div class="gr2">'+
     '<div><label>Nama</label><input id="uNama" placeholder="contoh: Roli"></div>'+
     '<div><label>PIN</label><input id="uPin" value="1234" inputmode="numeric" maxlength="8"></div>'+
     '<div><label>Peran</label><select id="uPeran">'+opsiPeran.map(function(p){ return '<option>'+p+'</option>'; }).join('')+'</select></div>'+
   '</div><button class="btn kecil" style="margin-top:10px" id="uSimpan">Tambah pengguna</button>'+
   '<div class="mini" style="margin-top:8px"><b>lapangan</b> = input harian, SPK, line, absensi · <b>manajemen</b> = semua menu termasuk Master, Pengguna, Pengaturan · <b>baca</b> = hanya melihat Dashboard, SPK, Dokumentasi, Rekap.</div></div>';

  function kirim(data, pesan){
    sibuk(true,'Menyimpan...');
    return api('penggunaSimpan', data)
      .then(function(j){ sibuk(false); S.master.pengguna=j.pengguna; kabar(pesan); pgPengguna(); })
      .catch(function(e){ sibuk(false); kabar(e.message,'bad'); });
  }

  el('isi').onclick = function(e){
    var b = e.target.closest('[data-simpanu]'); if(!b) return;
    var u = P[+b.dataset.simpanu], tr = b.closest('tr');
    var pin = tr.querySelector('[data-u="pin"]').value.trim();
    var peran = tr.querySelector('[data-u="peran"]').value;
    var aktif = tr.querySelector('[data-u="aktif"]').value;
    if(!/^\d{4,8}$/.test(pin)){ kabar('PIN harus angka, 4 sampai 8 digit.','bad'); return; }
    if(u.nama===S.nama && (peran!=='manajemen' || aktif!=='YA')){
      kabar('Peran atau status akun Anda sendiri tidak boleh diturunkan, supaya Anda tidak terkunci keluar.','bad'); return;

    if(u.nama===S.nama && pin!==String(u.pin)){

    if(!/^\d{4,8}$/.test(pin)){ kabar('PIN harus angka, 4 sampai 8 digit.','bad'); return; }
    if(P.some(function(u){ return String(u.nama).trim().toLowerCase()===nama.toLowerCase(); })){
      kabar('Nama itu sudah ada. Ubah langsung di tabel di atas.','info'); return;
    }
    kirim({target:nama, pin:pin, peranBaru:el('uPeran').value, aktif:'YA'}, 'Pengguna '+nama+' ditambahkan.');
  };
}

var APP_VERSI = '4.0';
var CODEGS_VERSI = '4.3';   // server satu berkas: Server_Insulation_BMKP_V4.gs
var HADIR_JEDA = 60000;        // kirim kabar "saya sedang membuka" tiap 60 detik
var _hadirTimer = null;

function namaMenu(id){
  var m = MENU.filter(function(x){ return x.id===id; })[0];
  return m ? m.nama : id;
}

function lapordiri(keluar){
  if(!S.nama) return Promise.resolve();
  return api('hadir', { menu: namaMenu(S.halaman), keluar: !!keluar })
    .then(function(j){
      S.hadir = j.daftar || [];
      lencanaHadir(true);
      if(S.halaman === 'sinkron') gambarHadir();
      return j;
    })
    .catch(function(){ lencanaHadir(false); });
}

function lencanaHadir(tersambung){
  var b = el('bLencana'); if(!b) return;
  if(!tersambung){
    b.className = 'lencana bad'; b.textContent = 'Tidak tersambung'; return;
  }
  var n = (S.hadir||[]).length;
  var lain = (S.hadir||[]).filter(function(x){ return x.nama !== S.nama; }).length;
  b.className = 'lencana ok';
  b.textContent = lain ? (n + ' orang online') : 'Online';
}

function mulaiHadir(){
  if(_hadirTimer) clearInterval(_hadirTimer);
  lapordiri();
  _hadirTimer = setInterval(function(){
    if(document.hidden) return;
    lapordiri();
  }, HADIR_JEDA);
  window.addEventListener('beforeunload', function(){
    try{
      navigator.sendBeacon(S.url, JSON.stringify({
        aksi:'hadir', nama:S.nama, peran:S.peran, keluar:true
      }));
    }catch(e){}
  });
}

function pgSinkron(){
  judul('Sinkronisasi', 'Keadaan sambungan ke server dan siapa saja yang sedang membuka aplikasi');
  var bolehUbah = S.peran === 'manajemen';
  el('isi').innerHTML =
   '<div class="kartu"><h3>Sedang membuka aplikasi</h3>'+
     '<div class="mini">Nama muncul di sini selama seseorang membuka aplikasi. Hilang sendiri 6 menit setelah aplikasinya ditutup.</div>'+
     '<div id="skHadir" style="margin-top:10px"><div class="kosong">Memuat…</div></div>'+
     '<div style="margin-top:10px"><button class="btn a3 kecil" id="skSegarkan">Segarkan</button></div>'+
   '</div>'+
   '<div class="kartu"><h3>Periksa sinkron</h3>'+
     '<div class="mini">Menjalankan pemeriksaan baris demi baris: versi aplikasi, sambungan ke server, dan jumlah data yang tersimpan. '+
     'Pakai ini kalau data di HP dan di laptop terasa berbeda.</div>'+
     '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">'+
       '<button class="btn" id="skPeriksa">Periksa sinkron</button>'+
       '<button class="btn a3" id="skSalin">Salin hasil</button>'+
     '</div>'+
     '<div id="skHasil" style="margin-top:12px"></div>'+
   '</div>'+
   '<div class="kartu"><h3>Alamat server</h3>'+
     '<div class="mini">Alamat Web App Apps Script (/exec). Isinya sudah tertanam di berkas aplikasi; ubah hanya kalau server dipindah.</div>'+
     '<input id="skUrl" value="'+esc(S.url)+'"'+(bolehUbah?'':' disabled')+' style="margin-top:8px">'+
     '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">'+
       '<button class="btn a3 kecil" id="skUji">Uji sambungan</button>'+
       (bolehUbah ? '<button class="btn a3 kecil" id="skSimpanUrl">Simpan alamat</button>' : '')+
     '</div>'+
     '<div id="skUrlPesan" style="margin-top:8px"></div>'+
   '</div>';

  el('skSegarkan').onclick = function(){ lapordiri(); };
  el('skPeriksa').onclick = periksaSinkron;
  el('skSalin').onclick = function(){
    var t = el('skHasil').innerText || '';
    if(!t){ kabar('Jalankan Periksa sinkron dulu.','info'); return; }
    navigator.clipboard.writeText(t).then(function(){ kabar('Hasil disalin.'); },
      function(){ kabar('Tidak bisa menyalin di perangkat ini.','bad'); });
  };
  el('skUji').onclick = function(){
    el('skUrlPesan').innerHTML = '<div class="mini">Menguji…</div>';
    fetch(el('skUrl').value.trim(), {method:'POST', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({aksi:'ping'})})
     .then(function(r){ return r.json(); })
     .then(function(j){
        el('skUrlPesan').innerHTML = '<div class="pesan ok">'+esc(j.pesan||'Tersambung')+
          (j.versiServer ? ' — Code.gs v'+esc(j.versiServer) : '')+'</div>';
     })
     .catch(function(){ el('skUrlPesan').innerHTML = '<div class="pesan bad">Tidak tersambung ke alamat itu.</div>'; });
  };
  if(bolehUbah && el('skSimpanUrl')) el('skSimpanUrl').onclick = function(){
    S.url = el('skUrl').value.trim();
    localStorage.setItem('ins_url_v42', S.url);
    el('skUrlPesan').innerHTML = '<div class="pesan ok">Alamat server disimpan di perangkat ini.</div>';
  };

  gambarHadir();
  lapordiri();
}

function gambarHadir(){
  var k = el('skHadir'); if(!k) return;
  var d = S.hadir || [];
  if(!d.length){ k.innerHTML = '<div class="kosong">Belum ada catatan. Tekan Segarkan.</div>'; return; }
  k.innerHTML = '<div class="gulir"><table><thead><tr>'+
    '<th>Nama</th><th style="width:110px">Peran</th><th style="min-width:130px">Menu dibuka</th><th style="width:110px">Terakhir</th>'+
    '</tr></thead><tbody>'+
    d.map(function(x){
      return '<tr><td><b>'+esc(x.nama)+'</b>'+(x.nama===S.nama?' <span class="mini">(Anda)</span>':'')+'</td>'+
        '<td>'+esc(String(x.peran||'').toUpperCase())+'</td>'+
        '<td>'+esc(x.menu||'—')+'</td>'+
        '<td>'+(x.menit<=1 ? 'baru saja' : x.menit+' menit lalu')+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}

function periksaSinkron(){
  var out = [];
  function baris(status, judul, isi){
    out.push({s:status, j:judul, i:isi==null?'':String(isi)});
    gambarPeriksa(out);
  }
  el('skHasil').innerHTML = '<div class="mini">Memeriksa…</div>';
  out = [];
  baris('ok','Versi aplikasi (index.html)', 'v'+APP_VERSI);
  baris(S.url?'ok':'bad','Alamat server', S.url || 'BELUM DIISI');

  var t0 = Date.now();
  api('ping').then(function(j){
    baris('ok','Sambungan ke server', (Date.now()-t0)+' ms — '+(j.pesan||'tersambung'));
    baris(j.versiServer===CODEGS_VERSI?'ok':'warn','Versi Code.gs di server',
      'v'+(j.versiServer||'tidak dilaporkan')+(j.versiServer===CODEGS_VERSI?' (cocok)':' — beda dengan yang diharapkan (v'+CODEGS_VERSI+')'));
    return api('v4Status').then(function(v){
      baris('ok','Fitur V4 di server', 'v'+v.versi+' — SPK '+v.tabel.SPK+' · line ber-SPK '+v.tabel.LineSPK+
        ' · laporan '+v.tabel.LaporanHarian+' · foto '+v.tabel.FotoHarian+' · absen manual '+v.tabel.AbsenManual+' · batas foto '+v.batasFoto);
    }, function(e){
      baris('bad','Fitur V4 di server', 'belum aktif — '+e.message+'. Tempel Server_Insulation_BMKP_V4.gs ke Code.gs lalu deploy versi baru');
    }).then(function(){ return api('periksaSinkron'); });
  }).then(function(j){
    baris('ok','Spreadsheet basis data', j.namaSheet);
    baris('ok','Alamat Spreadsheet', j.alamatSheet);
    baris('ok','Zona waktu server', j.zona);
    baris(j.pengguna?'ok':'bad','Pengguna aktif', j.pengguna + ' orang');

    var t = j.tabel || {};
    baris(t.Line?'ok':'warn','Jumlah line terdaftar', (t.Line||0) + ' baris');
    baris(t.Segmen?'ok':'warn','Jumlah segmen ukuran', (t.Segmen||0) + ' baris');
    baris(t.Progres?'ok':'warn','Catatan progres harian', (t.Progres||0) + ' baris');
    baris(t.Absensi?'ok':'warn','Catatan absensi', (t.Absensi||0) + ' baris');
    baris('ok','Seluruh baris tersimpan', j.totalBaris + ' baris di ' + Object.keys(t).length + ' tab');

    var lp = j.linePerArea || {};
    baris('ok','Line per area',
      (S.master.area||[]).map(function(a){ return a+': '+(lp[a]||0); }).join(' · '));

    var bp = j.boqPerArea || {};
    var kosong = (S.master.area||[]).filter(function(a){ return !bp[a]; });
    baris(kosong.length?'bad':'ok','Daftar BOQ per area',
      (S.master.area||[]).map(function(a){ return a+': '+(bp[a]||0)+' item'; }).join(' · ') +
      (kosong.length ? ' — ' + kosong.join(', ') + ' masih kosong, jalankan Lengkapi daftar BOQ di Spreadsheet' : ''));

    return api('hadir', {menu: namaMenu(S.halaman)});
  }).then(function(j){
    S.hadir = j.daftar || [];
    lencanaHadir(true); gambarHadir();
    baris('ok','Sedang membuka aplikasi', S.hadir.map(function(x){ return x.nama; }).join(', ') || 'hanya Anda');
    baris('ok','Waktu server', j.waktu);
    baris('ok','Pemeriksaan selesai', 'Semua langkah dijalankan');
  }).catch(function(e){
    baris('bad','Pemeriksaan terhenti', e.message);
  });
}

function gambarPeriksa(out){
  el('skHasil').innerHTML = '<div class="gulir" style="max-height:60vh"><table><thead><tr>'+
    '<th style="width:38px"></th><th style="min-width:170px">Yang diperiksa</th><th>Hasil</th>'+
    '</tr></thead><tbody>'+
    out.map(function(x){
      var w = x.s==='bad' ? 'background:#FBEAEA' : (x.s==='warn' ? 'background:#FDF6E3' : '');
      var t = x.s==='bad' ? '✕' : (x.s==='warn' ? '!' : '✓');
      return '<tr style="'+w+'"><td>'+t+'</td><td>'+esc(x.j)+'</td><td class="mini">'+esc(x.i)+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}

  el('isi').innerHTML =

  el('sSimpan').onclick = function(){

    api('settingSimpan',{data:data}).then(function(){
      sibuk(false); Object.keys(data).forEach(function(k){ S.master.setting[k]=data[k]; }); kabar('Pengaturan tersimpan.');
    }).catch(function(e){ sibuk(false); kabar(e.message,'bad'); });
  };
  el('sSimpanUrl').onclick = function(){
    S.url = el('sUrl').value.trim(); localStorage.setItem('ins_url_v42', S.url); kabar('Alamat server disimpan.');
  };
  el('sUji').onclick = function(){
    sibuk(true,'Menguji...');
    api('ping').then(function(j){ sibuk(false); kabar(j.pesan); }).catch(function(e){ sibuk(false); kabar(e.message,'bad'); });
  };
}

/* Masuk kembali otomatis setelah refresh (berlaku 12 jam).
   HARUS diletakkan paling akhir — semua fungsi dan daftar MENU
   sudah siap sebelum mulai() dipanggil. */
(function(){
  var sesi = null;
  try { sesi = JSON.parse(localStorage.getItem('ins_sesi')||'null'); } catch(e){}
  if(sesi && sesi.nama && S.url && (Date.now()-sesi.waktu) < 12*3600*1000){
    S.nama = sesi.nama; S.peran = sesi.peran;
    simpanSesi();
    try { mulai(); }
    catch(e){
      // kalau gagal, jangan tinggalkan layar kosong — kembalikan ke gerbang
      localStorage.removeItem('ins_sesi');
      el('app').classList.add('sembunyi');
      el('gerbang').classList.remove('sembunyi');
      el('gPesan').innerHTML = '<div class="pesan bad">Sesi tidak bisa dipulihkan. Silakan masuk lagi.</div>';
    }
  }
})();
</script>
