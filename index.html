<style>
:root{
  --merah:#8C1017; --emas:#C8912A; --arang:#2B2B2A;
  --bg:#F6F5F3; --kartu:#FFFFFF; --garis:#DEDCD8; --redup:#6B6A66;
  --hijau:#1F7A44; --kuning:#B8860B; --kepala:112px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--arang)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--merah)}

/* gerbang masuk */
#gerbang{position:fixed;inset:0;background:var(--arang);display:flex;align-items:center;justify-content:center;padding:20px;z-index:200}
#gerbang .kotak{width:100%;max-width:360px;background:#fff;border-radius:16px;padding:26px}
#gerbang h1{margin:0 0 2px;font-size:20px;color:var(--merah)}
#gerbang p{margin:0 0 18px;font-size:13px;color:var(--redup)}

label{display:block;font-size:12px;font-weight:600;color:var(--redup);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--garis);border-radius:9px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--emas);outline-offset:-1px}
.tbl{border:1px solid var(--garis);border-radius:9px;background:#fff}

.btn{display:inline-block;padding:10px 16px;border:0;border-radius:9px;background:var(--merah);color:#fff;font-weight:600;cursor:pointer}
.btn:active{opacity:.85}
.btn.a2{background:var(--arang)}
.btn.a3{background:#fff;color:var(--arang);border:1px solid var(--garis)}
.btn.kecil{padding:6px 11px;font-size:13px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* kepala beku */
header{position:sticky;top:0;z-index:50;background:var(--arang);color:#fff}
.brs1{display:flex;align-items:center;gap:10px;padding:10px 14px}
.brs1 b{font-size:15px;letter-spacing:.5px}
.brs1 .siapa{margin-left:auto;font-size:12px;color:#CFCDC7;text-align:right;line-height:1.25}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 10px 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{white-space:nowrap;padding:7px 13px;border:0;border-radius:20px;background:#3D3D3B;color:#CFCDC7;font-size:13px;font-weight:600;cursor:pointer}
nav button.on{background:var(--emas);color:var(--arang)}
.judul{position:sticky;top:var(--kepala);z-index:40;background:var(--bg);padding:14px 14px 8px;border-bottom:1px solid var(--garis)}
.judul h2{margin:0;font-size:19px}
.judul small{color:var(--redup)}
main{padding:14px 14px 90px;max-width:1100px;margin:0 auto}

.kartu{background:var(--kartu);border:1px solid var(--garis);border-radius:12px;padding:14px;margin-bottom:12px}
.kartu h3{margin:0 0 10px;font-size:15px;color:var(--merah)}
.baris{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.baris>div{flex:1 1 150px;min-width:0}
.gr2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 9px;border-bottom:1px solid var(--garis);text-align:left;vertical-align:middle}
th{background:var(--arang);color:#fff;font-size:12px;position:sticky;top:0;z-index:20}
.gulir{max-height:70vh}
td input,td select{padding:7px 8px;border-radius:7px}
.gulir{overflow:auto;border:1px solid var(--garis);border-radius:10px;background:#fff}
.angka{text-align:right;font-variant-numeric:tabular-nums}

.pil{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
.p-sket{background:#FBEAEA;color:var(--merah)}
.p-drawing{background:#FAF0DA;color:#8A6410}
.p-cetak{background:#E6F1E9;color:var(--hijau)}
.p-lanjut{background:#FAF0DA;color:#8A6410}
.p-selesai{background:#E6F1E9;color:var(--hijau)}

.stat{background:#fff;border:1px solid var(--garis);border-radius:12px;padding:13px}
.stat b{display:block;font-size:23px;line-height:1.2}
.stat span{font-size:12px;color:var(--redup)}

.pesan{padding:10px 13px;border-radius:9px;font-size:13.5px;margin-bottom:12px}
.pesan.ok{background:#E6F1E9;color:var(--hijau)}
.pesan.bad{background:#FBEAEA;color:var(--merah)}
.pesan.info{background:#FAF0DA;color:#8A6410}
.kosong{padding:26px 14px;text-align:center;color:var(--redup);font-size:14px}
.mini{font-size:12px;color:var(--redup)}
.tombol-bawah{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--garis);padding:10px 14px;display:flex;gap:10px;justify-content:flex-end;z-index:60}
.foto{width:74px;height:56px;object-fit:cover;border-radius:7px;border:1px solid var(--garis);background:#EFEEEC}
.logo-kecil{width:42px;height:42px;object-fit:cover;flex:0 0 auto;background:#fff;border-radius:8px;padding:3px}
.logo-besar{width:104px;height:104px;object-fit:cover;display:block;margin:0 auto 14px;background:#fff;border-radius:12px;padding:6px;border:1px solid var(--garis)}
@media print{ header,nav,.tombol-bawah{display:none!important} }
/* V3 — lencana sinkron & pratinjau impor */
.lencana{margin-left:10px;flex:0 0 auto;border:0;border-radius:20px;padding:6px 11px;font-size:11.5px;font-weight:700;color:#fff;background:#6B6A66;cursor:pointer;white-space:nowrap}
.lencana.ok{background:var(--hijau)}
.lencana.warn{background:var(--kuning)}
.lencana.bad{background:var(--merah)}
.tprogres{height:10px;border-radius:6px;background:#E5E3DF;overflow:hidden;margin:4px 0 8px}
.tprogres>i{display:block;height:100%;background:var(--emas);width:0;transition:width .2s}
/* V4 — dashboard, SPK, foto harian */
.tabper{display:flex;gap:4px;background:#EFEEEC;border-radius:10px;padding:3px}
.tabper button{border:0;background:transparent;padding:8px 13px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--redup)}
.tabper button.on{background:var(--arang);color:#fff}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin-bottom:12px}
.kpi .k{border-radius:12px;padding:13px 14px;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.kpi .k span{display:block;font-size:12px;opacity:.9}
.kpi .k b{display:block;font-size:24px;line-height:1.25;color:#fff!important}
.kpi .k small{display:block;font-size:11.5px;opacity:.95;color:#fff!important}
.kpi .k1{background:linear-gradient(135deg,#8C1017,#B3242C)}
.kpi .k2{background:linear-gradient(135deg,#2B2B2A,#4A4946)}
.kpi .k3{background:linear-gradient(135deg,#2F78B5,#4B92CC)}
.kpi .k4{background:linear-gradient(135deg,#1F7A44,#2E9A5A)}
.kpi .k5{background:linear-gradient(135deg,#8A6410,#C8912A)}
.kpi .k6{background:linear-gradient(135deg,#5B4E8C,#7A6AB0)}
.gridarea{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-bottom:12px}
.kartuarea{background:#fff;border:1px solid var(--garis);border-radius:12px;padding:13px}
.kartuarea .tiga{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;text-align:center}
.kartuarea .tiga div{background:#F6F5F3;border-radius:8px;padding:6px 2px}
.kartuarea .tiga b{display:block;font-size:17px}.kartuarea .tiga span{font-size:11px;color:var(--redup)}
.gridgraf{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:12px}
.gridgraf .kartu{margin-bottom:0}.gridgraf{margin-bottom:12px}
.kanvas{position:relative;height:280px}
.c{text-align:center}
.tabrinci input,.tabrinci select,.tabrinci textarea{width:100%;min-width:0;box-sizing:border-box}
textarea{width:100%;padding:10px 12px;border:1px solid var(--garis);border-radius:9px;background:#fff;resize:vertical}
.gridfoto{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.slotfoto{border:1px solid var(--garis);border-radius:10px;padding:8px;background:#fff}
.slotfoto img{width:100%;height:120px;object-fit:cover;border-radius:7px;cursor:zoom-in;background:#EFEEEC;display:block}
.tempatfoto{height:120px;border:2px dashed var(--garis);border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--redup);font-weight:600}
.galeri{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:8px}
.galeri figure{margin:0;border:1px solid var(--garis);border-radius:10px;overflow:hidden;background:#fff;cursor:zoom-in}
.galeri img{width:100%;height:140px;object-fit:cover;display:block;background:#EFEEEC}
.galeri figcaption{padding:6px 8px;font-size:12px;line-height:1.35}.galeri figcaption span{color:var(--redup)}
#lightbox{position:fixed;inset:0;background:rgba(20,20,20,.92);z-index:400;display:flex;align-items:center;justify-content:center;padding:14px}
#lightbox .lbisi{max-width:100%;max-height:100%;text-align:center}
#lightbox img{max-width:100%;max-height:78vh;border-radius:8px;display:block;margin:0 auto}
#lightbox .lbket{color:#fff;font-size:13px;margin-top:10px;line-height:1.5}
.lbtombol{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:26px;cursor:pointer}
@media print{ .kartu,.kartuarea,.kpi .k{break-inside:avoid} .kanvas{height:240px} main{padding:0} .judul{position:static} }
.sembunyi{display:none!important}
</style>

function api(aksi, data){
  data = data || {};
  data.aksi = aksi; data.nama = S.nama; data.peran = S.peran;
  if(!S.url) return Promise.reject(new Error('Alamat server belum diisi'));
  return fetch(S.url, {
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(data)
  }).then(function(r){ return r.text(); }).then(function(t){
    var j;
    try { j = JSON.parse(t); }
    catch(e){
      var isi = String(t).replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<script[\s\S]*?<\/script>/gi,' ')
        .replace(/<[^>]+>/g,' ').replace(/&nbsp;|&#39;|&quot;/g,' ').replace(/\s+/g,' ').trim();
      throw new Error('Server mengirim halaman galat Google, bukan data (aksi '+aksi+'). '+
        (isi ? 'Isi pesannya: "'+isi.slice(0,220)+'". ' : '')+
        'Biasanya karena deployment belum diperbarui ke versi terbaru, atau server sedang sibuk — coba lagi sebentar.');
    }
    if(!j.ok) throw new Error(j.pesan || 'Gagal');
    return j;
  });
}

function sibuk(on, teks){
  var b = el('sibuk');
  if(on){
    if(!b){
      b = document.createElement('div'); b.id='sibuk';
      b.style.cssText='position:fixed;inset:0;background:rgba(43,43,42,.35);display:flex;align-items:center;justify-content:center;z-index:300;color:#fff;font-weight:600';
      document.body.appendChild(b);
    }
    b.textContent = teks || 'Menyimpan...';
  } else if(b) b.remove();
}

function kabar(teks, jenis){
  var d = document.createElement('div');
  d.className = 'pesan ' + (jenis||'ok');
  d.textContent = teks;
  d.style.cssText += 'position:fixed;left:14px;right:14px;bottom:76px;z-index:150;box-shadow:0 4px 16px rgba(0,0,0,.15)';
  document.body.appendChild(d);
  setTimeout(function(){ d.remove(); }, 3200);
}

function mulai(){
  el('gerbang').classList.add('sembunyi');
  el('app').classList.remove('sembunyi');
  el('hNama').textContent = S.nama;
  el('hPeran').textContent = S.peran.toUpperCase();
  var boleh = MENU.filter(function(m){ return m.peran.indexOf(S.peran)>=0; });
  el('nav').innerHTML = boleh.map(function(m){
    return '<button data-h="'+m.id+'">'+m.nama+'</button>';
  }).join('') + '<button data-h="keluar">Keluar</button>';

    if(b.dataset.h==='keluar'){
      lapordiri(true);
      localStorage.removeItem('ins_ingat'); localStorage.removeItem('ins_sesi');

    buka(b.dataset.h);
  };
  S.halaman = S.peran==='lapangan' ? 'harian' : boleh[0].id;
  sibuk(true,'Memuat data...');
  api('master').then(function(j){
    S.master = j.data;
    return muatSPK();
  }).then(function(){
    sibuk(false); ukurKepala(); buka(S.halaman); mulaiHadir();
  }).catch(function(e){
    sibuk(false);
    localStorage.removeItem('ins_sesi');
    el('app').classList.add('sembunyi');
    el('gerbang').classList.remove('sembunyi');

    el('gPesan').innerHTML = '<div class="pesan bad">Tidak tersambung ke server. Periksa alamatnya di bawah.</div>';

}

function spkDari(id){ return S.spk.filter(function(s){ return s.idSPK===id; })[0] || null; }

    return s.area===area && (!hanyaAktif || s.status==='Aktif');

function tglObj(t){ var p = String(t).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function tglStr(d){ return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function tglTambah(t, n){ var d = tglObj(t); d.setDate(d.getDate()+n); return tglStr(d); }
function senin(t){ var d = tglObj(t), w = (d.getDay()+6)%7; d.setDate(d.getDate()-w); return tglStr(d); }
function selisihTgl(a, b){ return Math.round((tglObj(b)-tglObj(a))/86400000); }
var HARI = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
var BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
var BULAN_PANJANG = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function tglIndo(t, panjang){
  if(!t) return '—';
  var d = tglObj(t);
  return (panjang ? ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'][d.getDay()]+', ' : '')+
    p2(d.getDate())+' '+(panjang ? BULAN_PANJANG[d.getMonth()] : BULAN[d.getMonth()])+' '+d.getFullYear();
}
function tglPendek(t){ var d = tglObj(t); return HARI[d.getDay()]+' '+p2(d.getDate())+'/'+p2(d.getMonth()+1); }
function f1(v){ return n2(v).toLocaleString('id-ID',{maximumFractionDigits:1, minimumFractionDigits:0}); }
function persen(a, b){ return b>0 ? Math.round(a/b*100) : null; }
function teksPersen(p){ return p===null ? '—' : p+'%'; }
function warnaPersen(p){ return p===null ? 'var(--redup)' : (p>=100 ? 'var(--hijau)' : (p>=80 ? 'var(--kuning)' : 'var(--merah)')); }
function batang(p, warna){
  var w = p===null ? 0 : Math.min(100, p);
  return '<div class="tprogres" style="margin:4px 0 0"><i style="width:'+w+'%;background:'+(warna||'var(--emas)')+'"></i></div>';
}
function fotoSrc(f, ukuran){
  return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(f.fileId)+'&sz=w'+(ukuran||600);
}
function adalahM2(sat, L){
  if(sat) return /m2|m²/i.test(sat);
  return L ? n2(L.m2) > n2(L.pj) : false;
}
function karyawanArea(area){
  return (S.master.karyawan||[]).filter(function(k){
    return String(k.aktif||'YA').toUpperCase()!=='TIDAK' && (!k.area || k.area===area);
  });
}
function kebutuhanPekerja(area, t){
  return S.spk.filter(function(s){
    return s.area===area && s.status==='Aktif' &&
      (!s.tglMulai || s.tglMulai<=t) && (!s.tglTarget || t<=s.tglTarget);
  }).reduce(function(m,s){ return m + n2(s.targetPekerja); }, 0);
}

S.spkH = '';
var HAMBAT = ['','Cuaca','Material kosong','Pekerja kurang','Permit/SIKA','Badge expire','Alat rusak','Area dipakai unit lain','Menunggu inspeksi','Lain-lain'];
var CUACA = ['','Cerah','Berawan','Gerimis','Hujan','Hujan lebat'];

function opsiSpkHarian(area){
  var d = spkArea(area, true);
  var dipilih = spkDari(S.spkH);
  if(dipilih && dipilih.area===area && !d.some(function(s){ return s.idSPK===S.spkH; })) d = [dipilih].concat(d);   // SPK selesai tetap bisa dibuka dari Riwayat
  if(S.spkH && !d.some(function(s){ return s.idSPK===S.spkH; })) S.spkH = '';
  if(!S.spkH && S.spkPilihOtomatis!==area && modeArea(area)==='SPK' && d.length){ S.spkH = d[0].idSPK; }
  S.spkPilihOtomatis = area;
  return '<option value="">'+(modeArea(area)==='SPK' ? '— Tanpa SPK (input per line) —' : 'Semua line / tanpa SPK')+'</option>' + d.map(function(s){
    return '<option value="'+esc(s.idSPK)+'"'+(s.idSPK===S.spkH?' selected':'')+'>'+esc(s.noSPK)+
      (s.uraian?' — '+esc(String(s.uraian).slice(0,40)):'')+'</option>';
  }).join('');
}

function muatHarian(){
  var sp = spkDari(S.spkH);
  judul('Input harian', S.area + ' · ' + tglIndo(S.tanggal) + (sp ? ' · SPK ' + sp.noSPK : ''));
  el('hIsi').innerHTML = '<div class="kosong">Memuat…</div>';
  Promise.all([
    api('harianGet',{tanggal:S.tanggal, area:S.area}),
    S.v4ok ? api('v4LineSpkMap',{area:S.area}).catch(function(){ return {peta:{}}; }) : Promise.resolve({peta:{}}),
    S.v4ok ? api('v4LaporanGet',{tanggal:S.tanggal, area:S.area, idSPK:S.spkH}).catch(function(){ return null; }) : Promise.resolve(null),
    spkPakaiRincian(sp) ? api('v4ProgresSpkGet',{tanggal:S.tanggal, idSPK:S.spkH}).catch(function(){ return {data:[]}; }) : Promise.resolve({data:[]})
  ]).then(function(r){
    S.harian = r[0].data; S.harianKunci = S.tanggal+'|'+S.area;
    S.petaSPK = r[1].peta || {};
    S.itemLine = r[1].itemLine || {};
    S.pspkHari = r[3].data || [];
    S.lap = r[2] || {laporan:null, foto:[], manual:[], batasFoto:5};
    gambarHarian();
  }).catch(function(e){ el('hIsi').innerHTML='<div class="pesan bad">'+esc(e.message)+'</div>'; });
}

function muatLaporan(){
  var sp = spkDari(S.spkH);
  judul('Input harian', S.area + ' · ' + tglIndo(S.tanggal) + (sp ? ' · SPK ' + sp.noSPK : ''));
  if(!S.v4ok){ gambarHarian(); return; }
  api('v4LaporanGet',{tanggal:S.tanggal, area:S.area, idSPK:S.spkH})
    .then(function(j){ S.lap = j; gambarHarian(); })
    .catch(function(e){ kabar(e.message,'bad'); });
}

function lineCocokSPK(idLine){
  if((S.itemLine||{})[idLine]) return false;          // dikelola lewat rincian SPK
  if(!S.spkH) return true;
  return (S.petaSPK||{})[idLine] === S.spkH;
}

function gambarHarian(){
  var D = S.harian, peta = {};
  D.lines.forEach(function(L){ peta[L.idLine]=L; });

  // Semua baris hari ini disimpan lengkap (supaya simpan rencana tidak menghapus
  // baris SPK lain); yang ditampilkan saja yang disaring per SPK.
  var baris = D.rencana.map(function(r){
    var pr = D.progres.filter(function(p){return p.idLine===r.idLine;})[0] || {};
    return {idLine:r.idLine, targetM:r.targetM, regu:r.regu, jmlPekerja:r.jmlPekerja,
            terpasangM:pr.terpasangM, status:pr.status||'', faktorHambat:pr.faktorHambat||'', catatan:pr.catatan||''};
  });
  D.carry.forEach(function(id){
    if(baris.some(function(b){return b.idLine===id;})) return;
    var L = peta[id] || {};
    baris.push({idLine:id, targetM:Math.max(0,(n2(L.panjangTotal)+n2(L.totalM2)-n2(L.terpasang))).toFixed(1),
                regu:'', jmlPekerja:'', terpasangM:'', status:'', faktorHambat:'', catatan:'', lanjutan:true});
  });
  S.barisHarian = baris;

  var jam = new Date().getHours();
  var info = '';
  if(D.carry.length) info += '<div class="pesan info">'+D.carry.length+' pekerjaan dari hari sebelumnya otomatis terbawa ke sini.</div>';
  if(S.tanggal===hariIni() && jam >= n2(S.master.setting.jamBatasRealisasi) && !D.progres.length)
    info += '<div class="pesan bad">Sudah lewat jam batas dan realisasi hari ini belum diisi.</div>';

  var belum = D.lines.filter(function(L){
    return (n2(L.panjangTotal)+n2(L.totalM2)) - n2(L.terpasang) > 0.01 && lineCocokSPK(L.idLine);
  }).sort(function(a,b){ return String(a.noLine).localeCompare(String(b.noLine)); });
  var opsiLine = belum.map(function(L){
    var sisa = n2(L.panjangTotal)+n2(L.totalM2)-n2(L.terpasang);
    var sat = n2(L.totalM2)>n2(L.panjangTotal) ? 'm2' : 'm';
    return '<option value="'+esc(L.noLine)+'">sisa '+sisa.toFixed(1)+' '+sat+'</option>';
  }).join('');

  var sp = spkDari(S.spkH);
  var pakaiRincian = spkPakaiRincian(sp);
  var tampilLine = !pakaiRincian || sp.jmlLine > 0;
  var ringkasSpk = kartuRingkasSpk(sp) + (pakaiRincian ? kartuRincianSpk(sp) : '');
  var sudah = { rincian:(S.pspkHari||[]).length,
    line: D.progres.filter(function(p){ return String(p.catatan||'').indexOf('SPK|')!==0; }).length,
    laporan: S.lap && S.lap.laporan, foto: fotoLaporanIni().length, absen: ((S.lap&&S.lap.manual)||[]).length };
  if(sudah.rincian || sudah.line || sudah.laporan || sudah.foto || sudah.absen){
    info += '<div class="pesan info" style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">'+
      '<span><b>Data tanggal ini sudah pernah disimpan.</b> Ubah isian di bawah lalu simpan lagi — isian lama otomatis tergantikan.</span>'+
      (S.peran==='manajemen' ? '<button class="btn kecil" id="hHapusHari">Hapus input hari ini…</button>' : '')+'</div>';
  }
  if(pakaiRincian) info = info.replace(/<div class="pesan info">[^<]*terbawa ke sini\.<\/div>/,'');
  var html = info + ringkasSpk +
   '<div class="kartu'+(tampilLine?'':' sembunyi')+'"><h3>'+(pakaiRincian?'Line terhubung':'Pekerjaan hari ini')+(sp?' — '+esc(sp.noSPK):' — per line')+'</h3>'+
   '<div class="gulir"><table><thead><tr>'+

    var cocok = calon.filter(function(L){ return String(L.noLine).toUpperCase() === t; });
    if(!cocok.length) cocok = calon.filter(function(L){ return String(L.noLine).toUpperCase().indexOf(t) >= 0; });

  };
}

function gambarBaris(hambat, peta){
  var tampil = S.barisHarian.map(function(b,i){ return {b:b, i:i}; })
    .filter(function(x){ return lineCocokSPK(x.b.idLine); });
  var lain = S.barisHarian.length - tampil.length;
  if(!tampil.length){
    el('hBody').innerHTML = '<tr><td colspan="7" class="kosong">Belum ada line'+(S.spkH?' untuk SPK ini':'')+'. Tambahkan dari kotak di bawah.'+
      (lain ? '<br><span class="mini">'+lain+' line hari ini milik SPK lain — pilih "Semua SPK" untuk melihatnya.</span>' : '')+'</td></tr>';
    return;
  }
  el('hBody').innerHTML = tampil.map(function(x){
    var b = x.b, i = x.i;
    var L = peta[b.idLine] || {noLine:b.idLine};
    var sat = n2(L.totalM2)>n2(L.panjangTotal) ? 'M2' : 'Meter';
    b.satuan = sat;
    var sisa = Math.max(0, n2(L.panjangTotal)+n2(L.totalM2)-n2(L.terpasang));
    b.sisa = sisa;
    var idS = (S.petaSPK||{})[b.idLine];
    return '<tr>'+
      '<td><b>'+esc(L.noLine)+'</b>'+(b.lanjutan?' <span class="pil p-lanjut">lanjutan</span>':'')+
        (!S.spkH ? ' <span class="pil '+(idS?'p-cetak':'p-sket')+'">'+esc(idS?namaSpk(idS):'tanpa SPK')+'</span>' : '')+
        '<div class="mini">'+esc(L.noDWG||'')+' · satuan <b>'+(sat==='M2'?'m²':'meter')+'</b>'+
        ' · sisa <b>'+sisa.toFixed(1)+'</b></div></td>'+
      '<td><input class="angka" data-i="'+i+'" data-k="targetM" value="'+esc(b.targetM)+'" inputmode="decimal" placeholder="14"></td>'+
      '<td><input class="angka" data-i="'+i+'" data-k="terpasangM" value="'+esc(b.terpasangM)+'" inputmode="decimal" placeholder="12">'+
        (sisa>0.01 ? '<button class="btn a3 kecil" data-sisa="'+i+'" style="margin-top:4px;width:100%">Selesai ('+sisa.toFixed(1)+')</button>' : '')+
      '</td>'+
      '<td><select data-i="'+i+'" data-k="status">'+
        ['','Selesai','Lanjut'].map(function(s){return '<option'+(s===b.status?' selected':'')+'>'+s+'</option>';}).join('')+
      '</select></td>'+
      '<td><select data-i="'+i+'" data-k="faktorHambat">'+
        hambat.map(function(s){return '<option'+(s===b.faktorHambat?' selected':'')+'>'+s+'</option>';}).join('')+
      '</select></td>'+
      '<td><input class="angka" data-i="'+i+'" data-k="jmlPekerja" value="'+esc(b.jmlPekerja)+'" inputmode="numeric" placeholder="4"></td>'+
      '<td><button class="btn a3 kecil" data-hapus="'+i+'">×</button></td>'+
    '</tr>';
  }).join('') + (lain ? '<tr><td colspan="7" class="mini">+ '+lain+' line hari ini milik SPK lain (tetap tersimpan, tidak ditampilkan).</td></tr>' : '');

  el('hBody').oninput = function(e){
    var t=e.target; if(t.dataset.i===undefined) return;
    S.barisHarian[+t.dataset.i][t.dataset.k] = t.value;
  };
  el('hBody').onchange = el('hBody').oninput;
  el('hBody').onclick = function(e){
    var s=e.target.closest('[data-sisa]');
    if(s){
      var r = S.barisHarian[+s.dataset.sisa];
      r.terpasangM = String(r.sisa || 0);
      r.status = 'Selesai';
      gambarBaris(hambat, peta);
      return;
    }
    var b=e.target.closest('[data-hapus]'); if(!b) return;
    S.barisHarian.splice(+b.dataset.hapus,1); gambarBaris(hambat, peta);
  };
}

/* ─────────── rincian SPK di Input harian (V4.2) ─────────── */
var STATUS_LS = ['','Dikerjakan','Selesai'];

function spkPakaiRincian(sp){ return !!(sp && sp.item && sp.item.length); }

      }).join('')+
      '<div><span class="mini">Notifikasi / WO</span><div class="mini" style="color:var(--arang)">'+esc(sp.noWO||'—').replace(/\n/g,'<br>')+'</div></div>'+
    '</div>';
  } else {

    isi = '<div class="gr2" style="margin-top:10px">'+
      '<div><span class="mini">Terpasang pipa</span><div><b>'+f1(sp.terpasangM)+'</b> / '+f1(tgt)+' m · <b style="color:'+warnaPersen(p)+'">'+teksPersen(p)+'</b></div>'+batang(p)+'</div>'+
      '<div><span class="mini">Line</span><div><b>'+sp.lineSelesai+'</b> selesai dari '+sp.jmlLine+'</div></div>'+
      '<div><span class="mini">Kebutuhan pekerja</span><div><b>'+(sp.targetPekerja||'—')+'</b> orang</div></div></div>';
  }
  return '<div class="kartu" style="border-left:5px solid '+warnaArea(sp.area)+'">'+
    '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">'+
      '<div><b style="font-size:16px">'+esc(sp.noSPK)+'</b><div class="mini">'+esc(sp.uraian||'')+(sp.lokasi?' · '+esc(sp.lokasi):'')+'</div></div>'+
      '<div class="mini" style="text-align:right">Durasi '+tglIndo(sp.tglMulai)+' – '+tglIndo(sp.tglTarget)+
        (sisaHari!==null ? '<br><b style="color:'+(sisaHari<0?'var(--merah)':'var(--arang)')+'">'+(sisaHari<0 ? 'lewat '+(-sisaHari)+' hari' : 'sisa '+sisaHari+' hari')+'</b>' : '')+'</div>'+
    '</div>'+isi+'</div>';
}

function kartuRincianSpk(sp){
  var hariIniRow = {}; (S.pspkHari||[]).forEach(function(r){ hariIniRow[r.idItem] = r; });
  var its = sp.item.filter(function(it){ return it.inScope; });
  S.rincian = its.map(function(it){
    var r = hariIniRow[it.idItem] || {};
    var hariIniVol = n2(r.volume);
    return { it: it, target: r.target||'', volume: r.volume===''||r.volume==null ? '' : r.volume, status: r.status||'',
             faktorHambat: r.faktorHambat||'', catatan: r.catatan||'', jmlPekerja: r.jmlPekerja||'',
             sdKemarin: Math.max(0, n2(it.kum) - hariIniVol) };
  });
  return '<div class="kartu"><h3>Rincian pekerjaan hari ini — '+esc(sp.noSPK)+'</h3>'+
    '<div class="mini" style="margin-bottom:8px">Pagi: isi <b>Target</b> hari ini. Sore/malam: isi <b>Hari ini</b> (volume yang selesai dikerjakan), status, dan hambatan. '+
    'Satu tombol <b>Simpan progres SPK</b> untuk keduanya — boleh disimpan berkali-kali.</div>'+
    '<div class="gulir"><table><thead><tr>'+
      '<th style="min-width:230px">Pekerjaan</th><th style="width:100px">Volume SPK</th><th style="width:90px">s.d. kemarin</th>'+
      '<th style="width:82px">Target</th><th style="width:92px">Hari ini</th><th style="width:118px">Status</th>'+
      '<th style="width:140px">Faktor hambat</th><th style="width:64px">Org</th>'+
    '</tr></thead><tbody id="rBody"></tbody></table></div></div>';
}

function gambarRincian(){
  var b = el('rBody'); if(!b) return;
  b.innerHTML = S.rincian.map(function(r, i){
    var it = r.it, ls = itemLs(it), ghk = /ghk/i.test(it.kategori);
    var sisa = Math.max(0, n2(it.total) - r.sdKemarin);
    var label = '<div>'+pilKat(it.kategori)+' <b>'+esc(it.objek||'')+'</b>'+(it.ukuran?' <b>'+esc(it.ukuran)+'"</b>':'')+'</div>'+
      '<div class="mini">'+(it.no?esc(it.no)+'. ':'')+esc(it.uraian||'')+(it.noLine?' · line '+esc(it.noLine):'')+'</div>';
    if(ls){
      return '<tr><td>'+label+'</td><td class="mini">Ls</td><td class="mini">'+esc(it.status||'—')+'</td><td></td>'+
        '<td>'+(ghk ? '<label style="display:flex;gap:6px;align-items:center;font-weight:400;margin:0"><input type="checkbox" data-r="'+i+'" data-k="ghk" style="width:auto"'+(r.status?' checked':'')+'> dikerjakan</label>' : '')+'</td>'+
        '<td>'+(ghk ? '' : '<select data-r="'+i+'" data-k="status">'+STATUS_LS.map(function(s){ return '<option'+(s===r.status?' selected':'')+'>'+s+'</option>'; }).join('')+'</select>')+'</td>'+
        '<td><select data-r="'+i+'" data-k="faktorHambat">'+HAMBAT.map(function(s){ return '<option'+(s===r.faktorHambat?' selected':'')+'>'+s+'</option>'; }).join('')+'</select></td>'+
        '<td><input class="angka" data-r="'+i+'" data-k="jmlPekerja" value="'+esc(r.jmlPekerja)+'" inputmode="numeric"></td></tr>';
    }
    return '<tr'+(sisa<=0.001?' style="background:#F3F8F4"':'')+'><td>'+label+'</td>'+
      '<td><b>'+f1(it.total)+'</b> '+satTeks(it.satuan)+(n2(it.jumlah)>1?'<div class="mini">'+f1(it.volume)+' × '+f1(it.jumlah)+'</div>':'')+'</td>'+
      '<td>'+f1(r.sdKemarin)+'<div class="mini">sisa '+f1(sisa)+'</div></td>'+
      '<td><input class="angka" data-r="'+i+'" data-k="target" value="'+esc(r.target)+'" inputmode="decimal" placeholder="'+(sisa>0.001?f1(Math.min(sisa, n2(it.total))):'')+'"></td>'+
      '<td><input class="angka" data-r="'+i+'" data-k="volume" value="'+esc(r.volume)+'" inputmode="decimal">'+
        (sisa>0.001 ? '<button class="btn a3 kecil" data-rsisa="'+i+'" style="margin-top:4px;width:100%">Selesai ('+f1(sisa)+')</button>' : '')+'</td>'+
      '<td><select data-r="'+i+'" data-k="status">'+['','Lanjut','Selesai'].map(function(s){ return '<option'+(s===r.status?' selected':'')+'>'+s+'</option>'; }).join('')+'</select></td>'+
      '<td><select data-r="'+i+'" data-k="faktorHambat">'+HAMBAT.map(function(s){ return '<option'+(s===r.faktorHambat?' selected':'')+'>'+s+'</option>'; }).join('')+'</select></td>'+
      '<td><input class="angka" data-r="'+i+'" data-k="jmlPekerja" value="'+esc(r.jmlPekerja)+'" inputmode="numeric"></td></tr>';
  }).join('') || '<tr><td colspan="8" class="kosong">SPK ini belum punya rincian dalam scope.</td></tr>';
  b.oninput = b.onchange = function(e){
    var t = e.target; if(t.dataset.r===undefined) return;
    var r = S.rincian[+t.dataset.r];
    if(t.dataset.k==='ghk') r.status = t.checked ? 'Dikerjakan' : '';
    else r[t.dataset.k] = t.value;
  };
  b.onclick = function(e){
    var s = e.target.closest('[data-rsisa]'); if(!s) return;
    var r = S.rincian[+s.dataset.rsisa];
    r.volume = String(Math.round(Math.max(0, n2(r.it.total) - r.sdKemarin)*100)/100); r.status = 'Selesai';
    gambarRincian();
  };
}

function simpanProgresSpk(){
  var sp = spkDari(S.spkH); if(!sp) return;
  var kurang = S.rincian.filter(function(r){
    return !itemLs(r.it) && r.volume!=='' && n2(r.target)>0 && n2(r.volume) < n2(r.target) && !r.faktorHambat;
  });
  if(kurang.length){ kabar('Ada rincian di bawah target tapi faktor hambatnya belum dipilih.','bad'); return; }
  var lebih = S.rincian.filter(function(r){ return !itemLs(r.it) && r.sdKemarin + n2(r.volume) > n2(r.it.total) + 0.001; });
  if(lebih.length && !confirm(lebih.length+' rincian melebihi volume SPK. Tetap simpan?')) return;
  var rows = S.rincian.map(function(r){
    return { idItem:r.it.idItem, target:r.target, volume:r.volume, status:r.status, faktorHambat:r.faktorHambat,
             catatan:r.catatan, jmlPekerja:r.jmlPekerja };
  });
  sibuk(true,'Menyimpan progres SPK...');
  api('v4ProgresSpkSimpan',{tanggal:S.tanggal, area:S.area, idSPK:sp.idSPK, rows:rows})
    .then(function(j){ sibuk(false); kabar('Progres SPK tersimpan ('+j.jumlah+' rincian).'); muatSPK().then(muatHarian); })
    .catch(function(e){ sibuk(false); kabar(e.message,'bad'); });
}

      ta('lpBesok','Rencana besok',L.rencanaBesok,'Lanjut pasang cover aluminium line ...')+

function pasangLaporan(){

  el('lpCetak').onclick = cetakLaporanHarian;
}
function ambilLaporan(){

function simpanLaporan(){

  }).catch(function(e){ sibuk(false); kabar(e.message,'bad'); });
}

/* ─────────── foto harian (maks 5 per laporan) ─────────── */
function fotoLaporanIni(){
  return ((S.lap && S.lap.foto) || []).filter(function(f){ return f.idSPK === S.spkH; })
    .sort(function(a,b){ return a.urut-b.urut; });
}
function kartuFotoHarian(){
  if(!S.v4ok) return '';
  var batas = (S.lap && S.lap.batasFoto) || 5;
  var ada = fotoLaporanIni();
  var lain = ((S.lap && S.lap.foto) || []).length - ada.length;
  var slot = [];
  ada.forEach(function(f){
    slot.push('<div class="slotfoto">'+
      '<img src="'+fotoSrc(f,500)+'" alt="Foto '+f.urut+'" data-lihat="'+esc(f.idFoto)+'" loading="lazy">'+
      '<div class="mini" style="margin-top:4px"><b>#'+f.urut+'</b> '+esc(f.keterangan||'—')+'</div>'+
      '<button class="btn a3 kecil" data-hapusfoto="'+esc(f.idFoto)+'" style="margin-top:4px">Hapus</button></div>');
  });
  for(var i=ada.length;i<batas;i++){
    slot.push('<div class="slotfoto kosongfoto">'+
      '<div class="tempatfoto">Foto '+(i+1)+'</div>'+

function pasangFotoHarian(){
  [].forEach.call(document.querySelectorAll('[data-unggahfoto]'), function(inp){
    inp.onchange = function(){
      var f = inp.files[0]; if(!f) return;
      var ket = (document.querySelector('[data-ketfoto="'+inp.dataset.unggahfoto+'"]')||{}).value || '';
      sibuk(true,'Mengecilkan foto...');
      kecilkan(f, function(b64){
        sibuk(true,'Mengunggah foto...');
        api('v4FotoUpload',{tanggal:S.tanggal, area:S.area, idSPK:S.spkH, keterangan:ket, base64:b64})
          .then(function(j){
            sibuk(false); kabar('Foto tersimpan.');
            S.lap.foto = (S.lap.foto||[]).concat([j.foto]);
            gantiKartuFoto();
          })
          .catch(function(e){ sibuk(false); kabar(e.message,'bad'); });
      });
    };
  });
  [].forEach.call(document.querySelectorAll('[data-hapusfoto]'), function(b){
    b.onclick = function(){
      if(!confirm('Hapus foto ini?')) return;
      sibuk(true,'Menghapus...');
      api('v4FotoHapus',{idFoto:b.dataset.hapusfoto}).then(function(){
        sibuk(false); kabar('Foto dihapus.');
        S.lap.foto = S.lap.foto.filter(function(f){ return f.idFoto!==b.dataset.hapusfoto; });
        gantiKartuFoto();
      }).catch(function(e){ sibuk(false); kabar(e.message,'bad'); });
    };
  });
  [].forEach.call(document.querySelectorAll('[data-lihat]'), function(im){
    im.onclick = function(){ bukaLightbox(fotoLaporanIni(), im.dataset.lihat); };
  });
}
function gantiKartuFoto(){
  var k = document.querySelector('.gridfoto'); if(!k) return;
  var kartu = k.closest('.kartu');
  var t = document.createElement('div'); t.innerHTML = kartuFotoHarian();
  kartu.replaceWith(t.firstChild);
  pasangFotoHarian();
}

var STATUS_ABSEN = ['Hadir','Alpa','Tidak Finger','Sakit','Izin','Off','Dinas'];
function kartuAbsensi(){
  var kar = karyawanArea(S.area);

  var manual = {}; ((S.lap && S.lap.manual) || []).forEach(function(a){ manual[a.nama]=a.status; });
  var dariMesin = (S.harian.absensi||[]).filter(function(a){
    return String(a.sumber||'').toLowerCase().indexOf('finger')>=0 || a.jamMasuk;
  });
  var finger = {}; dariMesin.forEach(function(a){ finger[a.nama]=a; });
  var adaFinger = dariMesin.length > 0;
  var keb = kebutuhanPekerja(S.area, S.tanggal);

    'lalu dicocokkan otomatis dengan isian ini. '+(adaFinger ? 'Kolom Finger di bawah sudah terisi dari unggahan.' : 'Finger untuk tanggal ini belum diunggah.')+'</div>'+
    '<div class="gr2" style="margin-bottom:10px">'+
      '<div class="stat"><b id="abHadir">'+hadir+'</b><span>hadir (manual)</span></div>'+
      '<div class="stat"><b>'+kar.length+'</b><span>pekerja terdaftar di area</span></div>'+
      '<div class="stat"><b>'+(keb||'—')+'</b><span>kebutuhan menurut SPK aktif</span></div>'+
    '</div>'+
    (S.v4ok ? '' : '<div class="pesan info">Absensi manual tersimpan setelah Modul V4 aktif.</div>')+
    '<div class="gulir"><table><thead><tr>'+
    '<th>Nama</th><th style="width:150px">Status (manual)</th><th style="width:120px">Finger</th></tr></thead><tbody>'+
    kar.map(function(k){
      var fg = finger[k.nama];
      var cocok = !fg ? '' : ((fg.status==='Hadir') === (manual[k.nama]==='Hadir') ? 'p-cetak' : 'p-sket');
      return '<tr><td>'+esc(k.nama)+'<div class="mini">'+esc(k.jabatan||'')+'</div></td>'+
        '<td><select data-abs="'+esc(k.nama)+'">'+
        [''].concat(STATUS_ABSEN).map(function(s){return '<option'+(s===(manual[k.nama]||'')?' selected':'')+'>'+s+'</option>';}).join('')+
        '</select></td>'+
        '<td>'+(fg ? '<span class="pil '+cocok+'">'+esc(fg.status||'')+'</span><div class="mini">'+esc(fg.jamMasuk||'')+(fg.jamKeluar?'–'+esc(fg.jamKeluar):'')+'</div>' : '<span class="mini">—</span>')+'</td></tr>';
    }).join('')+'</tbody></table></div>'+

      '<button class="btn a3 kecil" id="abSemua">Isi yang kosong = Hadir</button>'+

    '</div></div>';

function pasangAbsensi(){
  if(!el('abSimpan')) return;
  function hitung(){
    var n = [].filter.call(document.querySelectorAll('[data-abs]'), function(s){ return s.value==='Hadir'; }).length;
    if(el('abHadir')) el('abHadir').textContent = n;
  }
  [].forEach.call(document.querySelectorAll('[data-abs]'), function(s){ s.onchange = hitung; });
  el('abSemua').onclick = function(){
    [].forEach.call(document.querySelectorAll('[data-abs]'), function(s){ if(!s.value) s.value='Hadir'; });
    hitung();
  };
  el('abSimpan').onclick = function(){
    var rows = [].map.call(document.querySelectorAll('[data-abs]'), function(s){
      return {nama:s.dataset.abs, status:s.value};
    }).filter(function(a){ return a.status; });
    if(!rows.length){ kabar('Belum ada status yang dipilih.','info'); return; }
    sibuk(true,'Menyimpan absensi...');
    api('v4AbsenManualSimpan',{tanggal:S.tanggal, area:S.area, rows:rows})
      .then(function(){ sibuk(false); kabar('Absensi manual tersimpan ('+rows.length+' orang).'); S.lap.manual = rows; })
      .catch(function(e){ sibuk(false); kabar(e.message,'bad'); });
  };
}

function simpanRencana(){
  var rows = S.barisHarian.filter(function(b){ return b.idLine && !(S.itemLine||{})[b.idLine]; }).map(function(b){
    return {idLine:b.idLine, targetM:n2(b.targetM), regu:b.regu||'', jmlPekerja:n2(b.jmlPekerja)};
  });

}

function simpanRealisasi(){
  var rows = S.barisHarian.filter(function(b){ return b.idLine && !(S.itemLine||{})[b.idLine] && (b.terpasangM!=='' || b.status); }).map(function(b){
    return {idLine:b.idLine, terpasangM:n2(b.terpasangM), status:b.status||'Lanjut',
            faktorHambat:b.faktorHambat||'', catatan:b.catatan||'', satuan:b.satuan||'Meter'};
  });
  if(!rows.length){ kabar('Belum ada meter terpasang yang diisi.','info'); return; }
  var kurang = S.barisHarian.filter(function(b){
    return b.status && n2(b.terpasangM) < n2(b.targetM) && !b.faktorHambat;

  if(kurang.length){ kabar('Ada baris di bawah target tapi faktor hambatnya belum diisi.','bad'); return; }

  // supaya data finger mingguan tidak tertimpa.
  sibuk(true,'Menyimpan realisasi...');
  api('realisasiSimpan',{tanggal:S.tanggal, area:S.area, rows:rows})
    .then(function(){ sibuk(false); kabar('Realisasi tersimpan.'); muatSPK().then(muatHarian); })
    .catch(function(e){ sibuk(false); kabar(e.message,'bad'); });
}

/* "1/2" → 0.5 · "1 1/2" atau "1.1/2" → 1.5 · "10" → 10 */
function ukuranAngka(t){
  t = String(t==null?'':t).replace(/["”″']/g,'').replace(/\s+/g,' ').trim();
  var m = t.match(/^(\d+)\s*[\.\s]\s*(\d+)\s*\/\s*(\d+)$/);
  if(m) return (+m[1]) + (+m[2] / +m[3]);
  m = t.match(/^(\d+)\s*\/\s*(\d+)$/);
  if(m) return (+m[1]) / (+m[2]);
  m = t.match(/^(\d+(?:[.,]\d+)?)$/);
  if(m) return parseFloat(m[1].replace(',','.'));
  return 0;
}
function ukuranTeks(a){
  var kamus = {0.5:'1/2', 0.75:'3/4', 1.25:'1 1/4', 1.5:'1 1/2', 2.5:'2 1/2'};
  return kamus[a] || String(a);
}
function angkaBebas(v){
  var t = String(v==null?'':v).replace(/[^0-9.,-]/g,'').replace(',','.');
  var n = parseFloat(t);
  return isNaN(n) ? 0 : n;
}

/* Daftar ukuran pipa yang ada di BOQ area ini: ukuran(inch) → item kontrak. */
function petaUkuranBOQ(area){
  var p = {};
  (S.master.hargaBOQ||[]).forEach(function(h){
    if(h.area !== area) return;
    if(String(h.aktif).toUpperCase()==='TIDAK') return;
    var bag = String(h.bagian||'').toUpperCase();
    if(bag.indexOf('ISOLASI PIPA')<0 && bag.indexOf('INSULASI PIPA')<0) return;
    var u = String(h.uraian||'');
    var m = u.match(/Dia\.?\s*([0-9 .\/]+?)\s*["”″]/);
    if(!m) return;
    var a = ukuranAngka(m[1]);
    if(!a) return;
    var luar = String(h.luarKontrak).toUpperCase()==='YA';
    if(p[a] && p[a].luar === false && luar) return;   // item dalam kontrak diutamakan
    var t = u.match(/Tebal\s*(\d+)\s*mm/i);
    p[a] = { kode:h.kode, tebal: t ? +t[1] : '', luar: luar, satuan: h.satuan || 'Meter', uraian: u };
  });
  return p;
}

/* Membedah nomor line: 202-P-001-8-C3-ST-50 */
function bedahNoLine(no){
  var t = String(no==null?'':no).trim().toUpperCase().replace(/\s+/g,'');
  var bag = t.split('-');
  var o = { plant:'', ukuran:0, tebal:'', pokok:t };
  if(bag.length >= 4){
    o.plant = bag[0];
    o.ukuran = ukuranAngka(bag[3]);
    o.pokok = bag.slice(0,4).join('-');
  }
  var akhir = bag[bag.length-1] || '';
  var m = akhir.match(/^(\d+)(?:\/(\d+))?$/);
  if(m) o.tebal = m[2] ? (m[1]+'/'+m[2]) : m[1];
  return o;
}

function bacaBerkasLine(){
  var f = el('lFile').files[0]; if(!f) return;
  var xls = /\.xlsx?$/i.test(f.name);
  var fr = new FileReader();
  el('lHasil').innerHTML = '<div class="mini">Membaca berkas…</div>';
  fr.onload = function(){
    var mtx;
    try{
      if(xls){
        var wb = XLSX.read(new Uint8Array(fr.result), {type:'array'});
        mtx = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:false, defval:''});
      } else {
        mtx = String(fr.result).replace(/\r/g,'').split('\n').map(function(b){
          return b.indexOf(';')>=0 && b.indexOf(';')<b.indexOf(',') ? b.split(';') : b.split(',');
        });
      }
    }catch(e){
      el('lHasil').innerHTML = '<div class="pesan bad">Berkas tidak bisa dibaca: '+esc(e.message)+'</div>'; return;
    }
    siapkanPratinjau(mtx);
  };
  if(xls) fr.readAsArrayBuffer(f); else fr.readAsText(f);
}

function cariKolom(kepala, kata){
  for(var i=0;i<kepala.length;i++){
    var h = kepala[i];
    for(var j=0;j<kata.length;j++) if(h.indexOf(kata[j])>=0) return i;
  }
  return -1;
}

function siapkanPratinjau(mtx){
  // Cari barisan judul. Harus ada SATU SEL yang berbunyi seperti judul kolom
  // nomor line, bukan sekadar baris yang memuat kata itu — supaya judul besar
  // di atas tabel ("LIST LINE NUMBER AREA BPP1") tidak ikut terbaca sebagai judul kolom.
  var judulIdx = -1;
  for(var i=0;i<Math.min(25, mtx.length);i++){
    var sel = (mtx[i]||[]).map(function(c){ return String(c==null?'':c).trim().toLowerCase(); });
    var terisi = sel.filter(function(c){ return c; }).length;
    if(terisi < 2) continue;
    var cocok = sel.some(function(h){
      return h.length <= 22 && /(line\s*number|no[_ ]?line|noline)/.test(h);
    });
    if(cocok){ judulIdx = i; break; }
  }
  if(judulIdx < 0){
    el('lHasil').innerHTML = '<div class="pesan bad">Tidak ketemu barisan judul. '+
      'Pastikan ada kolom bernama <b>LINE NUMBER</b> (atau no_line) di berkasnya.</div>';
    return;
  }
  var kepala = mtx[judulIdx].map(function(h){ return String(h).trim().toLowerCase(); });
  var kNo    = cariKolom(kepala, ['line number','no_line','noline','no line','line']);
  var kInch  = cariKolom(kepala, ['pipa inchi','inchi','inch','ukuran','dia']);
  var kMeter = cariKolom(kepala, ['jumlah meter','meter','panjang','volume','vol','qty']);
  var kPlant = cariKolom(kepala, ['plant','unit']);
  var kArea  = cariKolom(kepala, ['area']);
  var kElbow = cariKolom(kepala, ['elbow']);
  var kKode  = cariKolom(kepala, ['kode_boq','kode boq','kodeboq']);

  var peta = petaUkuranBOQ(S.area);
  var daftarUkuran = Object.keys(peta).map(Number).sort(function(a,b){return a-b;});
  if(!daftarUkuran.length){
    el('lHasil').innerHTML = '<div class="pesan bad">Daftar BOQ untuk area '+esc(S.area)+' belum terisi, '+
      'jadi ukuran pipa belum bisa dipasangkan ke item kontrak. Jalankan dulu menu <b>Lengkapi daftar BOQ</b> di Spreadsheet.</div>';
    return;
  }

  // sudah terdaftar di server
  api('lineNomor', {area:S.area}).then(function(j){
    var sudah = {};
    (j.nomor||[]).forEach(function(n){ sudah[String(n).trim().toUpperCase()] = true; });

    var dalamBerkas = {}, pokokHitung = {};
    var rows = [];

    for(var r = judulIdx+1; r < mtx.length; r++){
      var sel = mtx[r] || [];
      var no = String(kNo>=0 ? (sel[kNo]||'') : '').trim();
      if(!no) continue;
      if(/^no$|^total$/i.test(no)) continue;
      var b = bedahNoLine(no);
      pokokHitung[b.pokok] = (pokokHitung[b.pokok]||0) + 1;
      rows.push({
        no: no,
        inchKolom: kInch>=0 ? String(sel[kInch]||'').trim() : '',
        meter: kMeter>=0 ? angkaBebas(sel[kMeter]) : 0,
        plant: kPlant>=0 ? String(sel[kPlant]||'').trim() : '',
        areaFile: kArea>=0 ? String(sel[kArea]||'').trim() : '',
        elbow: kElbow>=0 ? angkaBebas(sel[kElbow]) : '',
        kodeManual: kKode>=0 ? String(sel[kKode]||'').trim() : '',
        bedah: b
      });
    }

    if(!rows.length){
      el('lHasil').innerHTML = '<div class="pesan bad">Barisan judul ketemu, tapi tidak ada baris data di bawahnya.</div>';
      return;
    }

    rows.forEach(function(x){
      var kunci = x.no.toUpperCase();
      var alasan = [], tingkat = 'ok';

      // ukuran: kolom PIPA INCHI dulu, kalau kosong ambil dari nomor line
      var dariKolom = ukuranAngka(x.inchKolom);
      var dariNama  = x.bedah.ukuran;
      x.ukuran = dariKolom || dariNama;
      x.asalUkuran = dariKolom ? 'kolom' : (dariNama ? 'nomor line' : '');

      if(dupCek(dalamBerkas, kunci)){
        tingkat='bad'; alasan.push('duplikat — nomor line ini muncul dua kali di berkas');
      } else if(sudah[kunci]){
        tingkat='bad'; alasan.push('sudah terdaftar di aplikasi');
      }
      dalamBerkas[kunci] = true;

      if(!x.ukuran){
        tingkat='bad'; alasan.push('ukuran pipa tidak terbaca');
      } else {
        var it = x.kodeManual ? cariItemKode(x.kodeManual) : peta[x.ukuran];
        if(!it){
          tingkat='bad';
          alasan.push('ukuran '+ukuranTeks(x.ukuran)+'" tidak ada di BOQ '+S.area);
        } else {
          x.kodeBOQ = it.kode; x.tebalKontrak = it.tebal; x.satuan = it.satuan;
          if(it.luar && tingkat!=='bad'){ tingkat='warn'; alasan.push('di luar kontrak'); }
          if(dariKolom && dariNama && dariKolom !== dariNama && tingkat!=='bad'){
            tingkat='warn';
            alasan.push('kolom inchi '+ukuranTeks(dariKolom)+'" beda dengan nomor line '+ukuranTeks(dariNama)+'"');
          }
          var tn = parseFloat(x.bedah.tebal);
          if(tn && it.tebal && tn !== it.tebal && tingkat!=='bad'){
            tingkat='warn';
            alasan.push('tebal di nomor line '+x.bedah.tebal+' mm, kontrak '+it.tebal+' mm');
          }
        }
      }

      if(!x.meter && tingkat!=='bad'){ tingkat='warn'; alasan.push('jumlah meter kosong'); }
      if(pokokHitung[x.bedah.pokok] > 1 && tingkat==='ok'){
        tingkat='warn';
        alasan.push('kembar — ada '+pokokHitung[x.bedah.pokok]+' baris bernomor pokok '+x.bedah.pokok+', cek apakah ini duplikat');
      }

      x.tingkat = tingkat;
      x.alasan = alasan.join(' · ');
    });

    S.imporRows = rows;
    gambarPratinjau();
  }).catch(function(e){
    el('lHasil').innerHTML = '<div class="pesan bad">'+esc(e.message)+'</div>';
  });
}

function dupCek(peta, kunci){ return !!peta[kunci]; }
function cariItemKode(kode){
  var h = (S.master.hargaBOQ||[]).filter(function(x){
    return x.area===S.area && String(x.kode)===String(kode);
  })[0];
  if(!h) return null;
  var t = String(h.uraian||'').match(/Tebal\s*(\d+)\s*mm/i);
  return { kode:h.kode, tebal: t?+t[1]:'', satuan:h.satuan||'Meter',
           luar: String(h.luarKontrak).toUpperCase()==='YA' };
}

      '<div class="stat"><b style="color:var(--kuning)">'+wr+'</b><span>masuk tapi perlu dicek</span></div>'+
      '<div class="stat"><b style="color:var(--merah)">'+bd+'</b><span>ditolak</span></div>'+

    '</div>'+
    '<div class="gulir" style="max-height:52vh"><table><thead><tr>'+
      '<th style="width:38px">No</th><th style="min-width:190px">Nomor line</th>'+
      '<th style="width:70px">Inch</th><th style="width:78px">Tebal</th>'+
      '<th style="width:80px">Meter</th><th style="width:80px">Item BOQ</th>'+
      '<th style="min-width:190px">Keterangan</th>'+
    '</tr></thead><tbody>'+
    tampil.slice(0,400).map(function(x,i){
      var warna = x.tingkat==='bad' ? 'background:#FBEAEA' : (x.tingkat==='warn' ? 'background:#FDF6E3' : '');
      var tanda = x.tingkat==='bad' ? '✕' : (x.tingkat==='warn' ? '!' : '✓');
      return '<tr style="'+warna+'">'+
        '<td>'+tanda+'</td>'+
        '<td><b>'+esc(x.no)+'</b></td>'+
        '<td>'+(x.ukuran?ukuranTeks(x.ukuran)+'"':'—')+
          '<div class="mini">'+esc(x.asalUkuran)+'</div></td>'+
        '<td>'+(x.tebalKontrak?x.tebalKontrak+' mm':'—')+'</td>'+
        '<td class="angka">'+(x.meter||'')+'</td>'+
        '<td>'+esc(x.kodeBOQ||'—')+'</td>'+
        '<td class="mini">'+esc(x.alasan||'siap')+'</td>'+
      '</tr>';
    }).join('')+
    '</tbody></table></div>'+
    (tampil.length>400 ? '<div class="mini" style="margin-top:6px">Ditampilkan 400 baris pertama. Semuanya tetap ikut diimpor.</div>' : '')+
    '<div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">'+
      '<button class="btn" id="lKirim"'+((ok+wr)?'':' disabled')+'>Impor '+(ok+wr)+' line ke '+esc(S.area)+'</button>'+
      '<span class="mini">Baris merah tidak ikut dikirim.</span>'+

  el('lUnduhTolak').onclick = function(){

    rows.filter(function(x){ return x.tingkat==='bad'; })
        .forEach(function(x){ isi += '"'+x.no+'","'+x.alasan+'"\n'; });
    unduhCsv('baris_ditolak_'+S.area+'.csv', isi);

function kirimImpor(){
  var pakai = (S.imporRows||[]).filter(function(x){ return x.tingkat!=='bad'; });
  if(!pakai.length) return;

  // baris dengan nomor line sama digabung jadi satu line dengan beberapa segmen
  var grup = {}, urutan = [];
  pakai.forEach(function(x){
    var k = x.no.toUpperCase();
    if(!grup[k]){ grup[k] = { noLine:x.no, unitPlant:[x.areaFile,x.plant].filter(Boolean).join(' · '), segmen:[] }; urutan.push(k); }
    grup[k].segmen.push({
      kodeBOQ: x.kodeBOQ, ukuran: ukuranTeks(x.ukuran), tebal: x.tebalKontrak || '',
      panjangAwal: x.meter || 0, elbow: x.elbow || '', keterangan: 'Impor daftar line'
    });
  });
  var semua = urutan.map(function(k){ return grup[k]; });

  el('lKirim').disabled = true;
  var total = semua.length, dibuat = 0, dilewat = 0, contohLewat = [];
  var kotak = el('lKirimStatus');
  kotak.innerHTML = '<div class="tprogres"><i id="lBar"></i></div><div class="mini" id="lTeks">Mengirim…</div>';

  function kelompok(mulai){
    var potong = semua.slice(mulai, mulai + KIRIM_PER);
    if(!potong.length){
      el('lBar').style.width = '100%';
      el('lTeks').innerHTML = '<div class="pesan ok"><b>'+dibuat+'</b> line masuk ke '+esc(S.area)+
        (dilewat ? ', <b>'+dilewat+'</b> dilewati karena sudah ada' : '')+'.'+
        (contohLewat.length ? '<div class="mini" style="margin-top:6px">'+contohLewat.slice(0,10).map(esc).join(' · ')+'</div>' : '')+
        '</div>';
      var spkImpor = el('lSpkImpor') ? el('lSpkImpor').value : '';
      if(spkImpor){
        api('v4LinePasang',{area:S.area, idSPK:spkImpor, noLines:semua.map(function(g){ return g.noLine; })})
          .then(function(j){ kabar(j.jumlah+' line dipasang ke SPK '+namaSpk(spkImpor)+'.'); muatSPK(); muatLine(); })
          .catch(function(e){ kabar('Line masuk, tapi gagal dipasang ke SPK: '+e.message,'bad'); muatLine(); });
      } else muatLine();
      return;
    }
    api('lineImporMassal', {
      area: S.area, baris: potong,
      terakhir: (mulai + KIRIM_PER >= semua.length),
      totalDibuat: dibuat + potong.length
    }).then(function(j){
      dibuat += j.dibuat || 0;
      dilewat += j.jmlLewat || 0;
      (j.lewat||[]).forEach(function(n){ if(contohLewat.length<10) contohLewat.push(n); });
      var persen = Math.round((mulai + potong.length) / total * 100);
      el('lBar').style.width = persen + '%';
      el('lTeks').textContent = 'Mengirim… ' + (mulai + potong.length) + ' dari ' + total + ' line (' + persen + '%)';
      setTimeout(function(){ kelompok(mulai + KIRIM_PER); }, 250);
    }).catch(function(e){
      el('lTeks').innerHTML = '<div class="pesan bad">Terhenti di baris ke-'+(mulai+1)+': '+esc(e.message)+
        '<div class="mini" style="margin-top:6px">'+dibuat+' line yang sudah masuk tetap tersimpan. '+
        'Impor ulang berkas yang sama aman — yang sudah ada akan dilewati.</div></div>';
      el('lKirim').disabled = false;
    });
  }
  kelompok(0);
}

function unduhDaftarLine(){
  if(!S.lines.length){ kabar('Belum ada line untuk diunduh.','info'); return; }
  var isi = 'area,no_line,no_dwg,unit_plant,ukuran_ringkas,panjang_m,total_m2,terpasang,status_drawing,ttd_ma,ttd_static,ttd_produksi\n';
  S.lines.forEach(function(L){
    isi += [L.area, L.noLine, L.noDWG, L.unitPlant||'', '"'+(L.ringkasUkuran||'')+'"',
            n2(L.panjangTotal), n2(L.totalM2), n2(L.terpasang), L.statusDrawing,
            L.ttdMA||'', L.ttdStatic||'', L.ttdProduksi||''].join(',') + '\n';
  });
  unduhCsv('daftar_line_'+S.area+'.csv', isi);
}

function muatLine(){
  Promise.all([api('lineList',{area:S.area}),
    S.v4ok ? api('v4LineSpkMap',{area:S.area}).catch(function(){ return {peta:{}}; }) : Promise.resolve({peta:{}})])
   .then(function(r){ S.lines=r[0].data; S.linePeta=r[1].peta||{}; gambarLine(); })
   .catch(function(e){ el('lIsi').innerHTML='<div class="pesan bad">'+esc(e.message)+'</div>'; });
}

function gambarLine(){
  if(!S.lines.length){ el('lIsi').innerHTML='<div class="kosong">Belum ada line di area ini.</div>'; return; }
  var batas = n2(S.master.setting.batasHariSket)||5;
  var sket = S.lines.filter(function(L){ return L.statusDrawing==='Sket'; });
  var tua = sket.map(function(L){ return selisihHari(L.tglSket); }).sort(function(a,b){return b-a;})[0]||0;

  var peringatan = sket.length
    ? '<div class="pesan '+(tua>batas?'bad':'info')+'">'+sket.length+' line masih berstatus Sket'+
      (tua? ' — yang tertua sudah '+tua+' hari.':'.')+'</div>' : '';

  el('lIsi').innerHTML = peringatan +
   '<div class="gulir"><table><thead><tr>'+
     '<th style="min-width:140px">No line</th><th style="min-width:210px">Ukuran pipa</th>'+
     '<th style="min-width:170px">No DWG</th><th style="min-width:110px">SPK</th>'+
     '<th style="width:80px">Panjang</th><th style="width:80px">Terpasang</th>'+
     '<th style="width:90px">Drawing</th><th style="width:70px">Foto</th><th style="width:105px">TTD</th>'+
     '<th style="width:120px"></th>'+
   '</tr></thead><tbody>'+
   S.lines.map(function(L,i){
     var before = L.foto.filter(function(f){return f.jenis==='Before';})[0];
     var after  = L.foto.filter(function(f){return f.jenis==='After';})[0];
     var ttd = ['MA','St','Pr'].map(function(x,k){
       var v=[L.ttdMA,L.ttdStatic,L.ttdProduksi][k];
       return '<span class="pil '+(v?'p-cetak':'p-sket')+'" style="margin-right:2px">'+x+'</span>';
     }).join('');
     return '<tr><td><b>'+esc(L.noLine)+'</b><div class="mini">'+esc(L.unitPlant||'')+'</div></td>'+

function boqArea(area){
  return (S.master.hargaBOQ || []).filter(function(b){ return b.area===area; });
}
function boqCari(area, kode){
  return boqArea(area).filter(function(b){ return String(b.kode)===String(kode); })[0];
}
function opsiBOQ(area, terpilih){
  var daftar = boqArea(area), grup = {}, urut = [];
  daftar.forEach(function(b){
    var g = b.bagian || 'Lain-lain';
    if(!grup[g]){ grup[g]=[]; urut.push(g); }
    grup[g].push(b);
  });
  return '<option value="">— pilih item BOQ —</option>' + urut.map(function(g){
    return '<optgroup label="'+esc(g)+'">'+ grup[g].map(function(b){
      return '<option value="'+esc(b.kode)+'"'+(String(b.kode)===String(terpilih)?' selected':'')+'>'+
        esc(b.kode)+' — '+esc(String(b.uraian).slice(0,64))+' ('+esc(b.satuan)+')</option>';
    }).join('') + '</optgroup>';
  }).join('');
}

function kecilkan(file, cb){
  var fr = new FileReader();
  fr.onload = function(){
    var img = new Image();
    img.onload = function(){
      var m = 1280, w=img.width, h=img.height;
      if(w>m || h>m){ if(w>h){ h=Math.round(h*m/w); w=m; } else { w=Math.round(w*m/h); h=m; } }
      var c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.72).split(',')[1]);
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

function bacaFileAbsensi(){
  var f = el('aFile').files[0]; if(!f) return;
  var xls = /\.xlsx?$/i.test(f.name);
  var fr = new FileReader();
  fr.onload = function(){
    var matriks;
    try {
      if(xls){
        var wb = XLSX.read(new Uint8Array(fr.result), {type:'array'});
        matriks = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:false, defval:''});
      } else {
        var teks = String(fr.result).replace(/\r/g,'');
        var brs = teks.split('\n').filter(function(b){ return b.trim(); });
        var pisah = [',',';','\t','|'].map(function(p){ return {p:p, n:brs[0].split(p).length}; })
                      .sort(function(a,b){ return b.n-a.n; })[0].p;
        matriks = brs.map(function(b){ return b.split(pisah).map(function(x){ return x.trim().replace(/^"|"$/g,''); }); });
      }
    } catch(e){
      el('aPeta').innerHTML = '<div class="pesan bad">Berkas tidak bisa dibaca: '+esc(e.message)+'</div>'; return;
    }
    if(!matriks || matriks.length < 2){
      el('aPeta').innerHTML = '<div class="pesan bad">Berkas kosong.</div>'; return;
    }

    var awal = matriks.slice(0,12).map(function(r){ return r.join(' ').toUpperCase(); }).join(' ');
    if(awal.indexOf('SCAN LOG') >= 0 || awal.indexOf('PIN / NIP') >= 0){
      uraiScanLog(matriks);
    } else {
      S.absKepala = matriks[0].map(function(h){ return String(h).trim(); });
      S.absBaris  = matriks.slice(1).map(function(r){ return r.map(function(x){ return String(x).trim(); }); });
      S.absMode = 'tabel';
      gambarPemetaan();
    }
  };
  if(xls) fr.readAsArrayBuffer(f); else fr.readAsText(f);
}

/* Pembaca format "LAPORAN SCAN LOG":
   tiap orang punya blok Nama / PIN / Jabatan / Departemen, lalu daftar tanggal + jam scan. */
function uraiScanLog(m){
  var hasil = [], dep = {}, orang = 0, cur = null;
  function isi(sel){
    for(var i=1;i<sel.length;i++){
      var v = String(sel[i]||'').trim().replace(/^:\s*/,'');
      if(v) return v;
    }
    return '';
  }
  m.forEach(function(r){
    var a = String(r[0]||'').trim();
    if(/^Nama\b/i.test(a)){ cur = {nama:isi(r), pin:'', jabatan:'', dep:''}; orang++; return; }
    if(!cur) return;
    if(/^PIN/i.test(a)){ cur.pin = isi(r).split('/')[0].trim(); return; }
    if(/^Jabatan/i.test(a)){ cur.jabatan = isi(r); return; }
    if(/^Departemen/i.test(a)){
      cur.dep = isi(r).replace(/\/+\s*$/,'').trim();
      if(cur.dep) dep[cur.dep] = (dep[cur.dep]||0)+1;
      return;
    }
    var t = a.match(/(\d{2})-(\d{2})-(\d{4})/);
    if(!t) return;
    var jam = [];
    for(var i=1;i<r.length;i++){
      var v = String(r[i]||'').trim();
      if(/^\d{1,2}[.:]\d{2}/.test(v)) jam.push(v.replace(/\./g,':').slice(0,5));
    }
    hasil.push({
      pin: cur.pin, nama: cur.nama, jabatan: cur.jabatan, dep: cur.dep,
      tanggal: t[3]+'-'+t[2]+'-'+t[1],
      jamMasuk: jam[0]||'', jamKeluar: jam.length>1 ? jam[jam.length-1] : ''
    });
  });
  S.absMode = 'scanlog';
  S.absScan = hasil;
  S.absDep = Object.keys(dep).sort();
  S.absOrang = orang;
  gambarPetaDepartemen();
}

function tebakArea(d){
  var u = String(d).toUpperCase();
  if(u.indexOf('MA-1')>=0 || u.indexOf('MA1')>=0 || u.indexOf('STEAM')>=0) return 'MA1';
  if(u.indexOf('MA-2')>=0 || u.indexOf('MA2')>=0) return 'MA2';
  if(u.indexOf('MA-3')>=0 || u.indexOf('MA3')>=0) return 'MA3';
  if(u.indexOf('UTIL')>=0) return 'Utilities';
  return '';
}

  }
  return -1;
}

function rapikanTanggal(t){
  t = String(t||'').trim();
  if(!t) return '';
  t = t.split(' ')[0];
  var m;
  if((m = t.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/)))
    return m[1]+'-'+p2(+m[2])+'-'+p2(+m[3]);
  if((m = t.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/)))
    return m[3]+'-'+p2(+m[2])+'-'+p2(+m[1]);
  if((m = t.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{2})$/)))
    return '20'+m[3]+'-'+p2(+m[2])+'-'+p2(+m[1]);
  return '';
}

function ambilBarisAbsensi(){
  var pin=+el('pkPin').value, nm=+el('pkNama').value, tg=+el('pkTgl').value,
      ms=+el('pkMasuk').value, kl=+el('pkKeluar').value;
  return S.absBaris.map(function(r){
    return {
      pin:  pin>=0 ? r[pin] : '',
      nama: nm>=0  ? r[nm]  : '',
      tanggal: tg>=0 ? rapikanTanggal(r[tg]) : '',
      jamMasuk: ms>=0 ? (r[ms]||'') : '',
      jamKeluar: kl>=0 ? (r[kl]||'') : ''

/* ═══════════════════ SPK — FORM PERINTAH KERJA (V4.2) ═══════════════════
   Satu SPK/FPK berisi beberapa rincian pekerjaan (persiapan, bongkar, fabrikasi,
   pasang, GHK) dengan ukuran pipa, volume, dan satuan masing-masing.
   Area yang belum memakai SPK tetap bisa input per line (mode LINE).        */
S.spkArea = '';
var KATEGORI_SPK = ['Persiapan','Bongkar','Fabrikasi','Pasang','Bongkar-pasang','GHK','Lain-lain'];
var SATUAN_SPK = ['M','M2','M3','Box','Unit','Ls'];
var UKURAN_SPK = ['','1/2','3/4','1','1 1/2','2','3','4','6','8','10','12','14','16','18','20','24','30'];
var WARNA_KAT = {'Persiapan':'#5B6B7A','Bongkar':'#B5562B','Fabrikasi':'#7A4E9C','Pasang':'#1F7A44','Bongkar-pasang':'#2F78B5','GHK':'#6B6A66','Lain-lain':'#6B6A66'};
function pilKat(k){ return '<span class="pil" style="background:'+(WARNA_KAT[k]||'#6B6A66')+';color:#fff">'+esc(k||'—')+'</span>'; }
function satTeks(s){ return ({M:'m', M2:'m²', M3:'m³', Ls:'Ls'})[s] || String(s||'').toLowerCase(); }
function itemLs(it){ return /ls|lot/i.test(it.satuan||'') || !n2(it.total||n2(it.volume)*(n2(it.jumlah)||1)); }
function modeArea(a){ return ((S.mode||{}).mode||{})[a] || (a==='MA3' ? 'SPK' : 'LINE'); }
function kontrakArea(a){ return ((S.mode||{}).kontrak||{})[a] || ''; }
function ringkasTeks(s){
  if(!s.item || !s.item.length) return s.volLineM ? f1(s.terpasangM)+' / '+f1(s.volLineM)+' m' : '—';
  return (s.ringkas||[]).map(function(r){ return r.kelompok+' '+f1(r.kum)+'/'+f1(r.vol)+' '+satTeks(r.satuan); }).join(' · ') || (s.item.length+' rincian');
}

    var d = S.spk.filter(function(s){ return s.area===a && s.status==='Aktif'; });
    var nilai = d.filter(function(s){ return s.persen!==null; });
    var p = nilai.length ? Math.round(nilai.reduce(function(m,s){ return m+s.persen; },0)/nilai.length) : null;

    '<th style="min-width:140px">Durasi</th><th style="min-width:200px">Rincian (terpasang / volume)</th><th style="width:130px">Capaian</th>'+
    '<th style="width:80px">Status</th><th style="width:120px"></th>'+
   '</tr></thead><tbody>'+
   data.map(function(s){
     var p = s.persen, sisa = s.tglTarget ? selisihTgl(hari, s.tglTarget) : null;

         (sisa!==null && s.status==='Aktif' ? '<br><b style="color:'+(sisa<0?'var(--merah)':'var(--arang)')+'">'+(sisa<0?'lewat '+(-sisa)+' hari':'sisa '+sisa+' hari')+'</b>' : '')+'</td>'+
       '<td class="mini">'+esc(ringkasTeks(s))+(s.item&&s.item.length?'<br>'+s.item.length+' rincian':'')+'</td>'+

   }).join('')+'</tbody></table></div>'+
   '<div class="mini" style="margin-top:6px">Capaian = rata-rata persen rincian yang bervolume (meter, m², m³). Persiapan dan GHK dicatat sebagai status. '+
   'Baris merah = lewat tanggal selesai dan belum 100%.</div>';

  el('spIsi').onclick = function(e){
    var b = e.target.closest('[data-bukaspk]');

function formSpk(s){

      '<td><input data-f="volume" class="angka" inputmode="decimal" value="'+esc(it.volume||'')+'" placeholder="'+(itemLs(it)?'':'10')+'"'+dis+'></td>'+

function bacaItemForm(){
  [].forEach.call(document.querySelectorAll('#itBody tr[data-it]'), function(tr){
    var it = S.formItem[+tr.dataset.it]; if(!it) return;

      it[x.dataset.f] = x.type==='checkbox' ? x.checked : x.value;
    });
  });
}

function itemUntukServer(area){
  var peta = petaUkuranBOQ(area);
  var terdaftar = {}; (S.formLines||[]).forEach(function(L){ terdaftar[String(L.noLine).trim().toUpperCase()] = L.idLine; });
  return S.formItem.filter(function(it){ return String(it.uraian||'').trim() || n2(it.volume); }).map(function(it){
    var pasang = /pasang/i.test(it.kategori);
    var kode = it.kodeBOQ || '';
    if(!kode && pasang && it.ukuran && /^m$/i.test(it.satuan||'')){ var b = peta[ukuranAngka(it.ukuran)]; if(b) kode = b.kode; }
    var o = { idItem: it.idItem || '', no: it.no||'', kategori: it.kategori, uraian: it.uraian||'', objek: it.objek||'',
      ukuran: it.ukuran||'', volume: it.volume, jumlah: it.jumlah, satuan: it.satuan||'', inScope: it.inScope!==false, kodeBOQ: kode, idLine:'' };
    var nl = String(it.noLineInput||'').trim();
    if(pasang && nl){
      var id = terdaftar[nl.toUpperCase()];
      if(id) o.idLine = id; else o.noLineBaru = nl;
    }
    return o;
  });
}

function simpanSpkForm(s, baru){

  var area = el('sArea').value;
  var data = { idSPK:s.idSPK||'', noSPK:el('sNo').value.trim(), area:area, tglSPK:el('sTgl').value,
    noKontrak:el('sKontrak').value.trim(), noWO:el('sWO').value.trim(), noIRES:el('sIres').value.trim(),
    lokasi:el('sLokasi').value, tglMulai:el('sMulai').value, tglTarget:el('sTarget').value,

  api('v4SpkSimpan',{spk:data}).then(function(j){
    sibuk(false); kabar('SPK tersimpan.'); S.spkArea = area;
    muatSPK().then(function(){ formSpk(spkDari(j.idSPK)); });

  if(!el('sLine')) return;
  Promise.all([api('lineList',{area:s.area}), api('v4LineSpkMap',{area:s.area})]).then(function(r){
    S.spkLines = r[0].data || []; S.spkPeta = r[1].peta || {};
    gambarLineSpk(s);
  }).catch(function(e){ el('sLine').innerHTML = '<div class="pesan bad">'+esc(e.message)+'</div>'; });
}

         '<td>'+(boleh?'<button class="btn a3 kecil" data-lepas="'+esc(L.idLine)+'">Lepas</button>':'')+'</td></tr>';
     }).join('')+'</tbody></table></div>' : '<div class="kosong">Belum ada line terhubung.</div>')+
   (boleh ? '<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600">Pasang line ke SPK ini ('+bebas.length+' line belum ber-SPK)</summary>'+
     '<div class="baris" style="margin-top:8px"><div style="flex:2 1 260px"><input id="slCari" placeholder="Saring nomor line, misal 202-P-00"></div></div>'+
     '<div class="gulir" style="max-height:35vh;margin-top:8px"><table><thead><tr><th style="width:40px"><input type="checkbox" id="slSemua" style="width:auto"></th><th>No line</th><th style="width:90px">Volume</th></tr></thead><tbody id="slBody"></tbody></table></div>'+
     '<div style="margin-top:10px"><button class="btn kecil" id="slPasang">Pasang yang dicentang</button></div></details>' : '');
  function daftar(){
    var t = (el('slCari').value||'').trim().toUpperCase();

    }).join('') || '<tr><td colspan="3" class="kosong">Tidak ada line yang cocok.</td></tr>';
  }
  if(boleh){
    el('slCari').oninput = daftar;
    el('slSemua').onchange = function(){ var c = this.checked; [].forEach.call(document.querySelectorAll('[data-pilih]'), function(x){ x.checked = c; }); };
    el('slPasang').onclick = function(){
      var ids = [].filter.call(document.querySelectorAll('[data-pilih]'), function(x){ return x.checked; }).map(function(x){ return x.dataset.pilih; });
      if(!ids.length){ kabar('Centang dulu line yang mau dipasang.','info'); return; }
      pasangLine(s, ids, '');

  };
}

function pasangLine(s, ids, mode){
  sibuk(true, mode==='lepas' ? 'Melepas line...' : 'Memasang line...');
  api('v4LinePasang',{area:s.area, idSPK: mode==='lepas' ? '' : s.idSPK, idLines:ids}).then(function(j){

    muatSPK().then(function(){ muatLineSpk(spkDari(s.idSPK)||s); });
  }).catch(function(e){ sibuk(false); kabar(e.message,'bad'); });
}

function rentangDsb(){
  var D = S.dsb, a = D.acuan;
  if(D.per==='harian') return { dari: tglTambah(a,-29), sampai: a };
  if(D.per==='mingguan'){ var s = senin(a); return { dari: tglTambah(s,-7*11), sampai: tglTambah(s,6) }; }
  var d = tglObj(a), awal = new Date(d.getFullYear(), d.getMonth()-11, 1), akhir = new Date(d.getFullYear(), d.getMonth()+1, 0);
  return { dari: tglStr(awal), sampai: tglStr(akhir) };
}
function kunciBucket(t){
  if(S.dsb.per==='harian') return t;
  if(S.dsb.per==='mingguan') return senin(t);
  return t.slice(0,7);
}
function labelBucket(k){
  if(S.dsb.per==='harian') return tglPendek(k);
  if(S.dsb.per==='mingguan') return 'Mg '+p2(tglObj(k).getDate())+'/'+p2(tglObj(k).getMonth()+1);
  var p = k.split('-'); return BULAN[+p[1]-1]+' '+p[0].slice(2);
}
function daftarBucket(r){
  var out = [], t = r.dari, ada = {};
  while(t <= r.sampai){ var k = kunciBucket(t); if(!ada[k]){ ada[k]=1; out.push(k); } t = tglTambah(t,1); }
  return out;
}

/* Mengelompokkan data mentah per periode × area. */
function hitungDsb(J, buckets){
  var lmap = {}; J.lines.forEach(function(L){ lmap[L.id] = L; });
  var areas = S.master.area;
  var A = {};
  buckets.forEach(function(b){
    A[b] = {};
    areas.forEach(function(a){
      A[b][a] = { rM:0, aM:0, rM2:0, aM2:0, rM3:0, aM3:0, aB:0, orgRencana:0, manual:0, finger:0, keb:0,
                  lap:0, foto:0, hariKerja:{}, hariFinger:{} };
    });
  });
  function sel(t, a){ var b = kunciBucket(t); return A[b] && A[b][a]; }
  var hambat = {};
  J.progres.forEach(function(p){
    var c = sel(p.t, p.a); if(!c) return;
    var L = lmap[p.id];
    if(adalahM2(p.sat, L)) c.aM2 += p.v; else c.aM += p.v;
    c.hariKerja[p.t] = 1;
    if(p.h && (!S.dsb.area || p.a===S.dsb.area)) hambat[p.h] = (hambat[p.h]||0)+1;
  });
  // progres per rincian SPK: yang terhubung ke line sudah terhitung lewat progres line
  (J.progresSpk||[]).forEach(function(r){
    var c = sel(r.t, r.a); if(!c) return;
    var sat = String(r.sat||'').toLowerCase(), pasang = /pasang/i.test(r.kat);
    var kunci = /m3|m³/.test(sat) ? '3' : (/m2|m²/.test(sat) ? '2' : (/^m$/.test(sat) ? '1' : ''));
    if(r.v || r.st) c.hariKerja[r.t] = 1;
    if(r.h && (!S.dsb.area || r.a===S.dsb.area)) hambat[r.h] = (hambat[r.h]||0)+1;
    if(!kunci) return;
    if(pasang){
      if(kunci==='1'){ c.rM += r.tg; if(!r.link) c.aM += r.v; }
      if(kunci==='2'){ c.rM2 += r.tg; if(!r.link) c.aM2 += r.v; }
      if(kunci==='3'){ c.rM3 += r.tg; c.aM3 += r.v; }
    } else if(/bongkar/i.test(r.kat) && kunci==='1') c.aB += r.v;
  });
  J.rencana.forEach(function(r){
    var c = sel(r.t, r.a); if(!c) return;
    var L = lmap[r.id];
    if(adalahM2('', L)) c.rM2 += r.v; else c.rM += r.v;
    c.orgRencana += r.org;
  });
  J.manual.forEach(function(m){ var c = sel(m.t, m.a); if(!c) return; c.hariKerja[m.t] = 1; if(m.s==='Hadir') c.manual++; });
  J.finger.forEach(function(f){ var c = sel(f.t, f.a); if(!c) return; c.hariFinger[f.t] = 1; if(/hadir/i.test(f.s)) c.finger++; });
  J.laporan.forEach(function(l){ var c = sel(l.t, l.a); if(!c) return; c.lap++; c.hariKerja[l.t] = 1; });
  J.foto.forEach(function(f){ var c = sel(f.t, f.a); if(c) c.foto++; });
  // kebutuhan pekerja dihitung hanya pada hari kerja yang tercatat (bukan semua hari kalender)
  buckets.forEach(function(b){ areas.forEach(function(a){
    var c = A[b][a];
    Object.keys(c.hariKerja).forEach(function(t){ c.keb += kebutuhanPekerja(a, t); });
    c.nHari = Object.keys(c.hariKerja).length;
  }); });
  return { A:A, hambat:hambat, lmap:lmap };
}

function jumlahArea(sel, areas){
  var t = { rM:0, aM:0, rM2:0, aM2:0, rM3:0, aM3:0, aB:0, manual:0, finger:0, keb:0, lap:0, foto:0, nHari:0 };
  areas.forEach(function(a){ var c = sel[a]; Object.keys(t).forEach(function(k){ t[k] += c[k]||0; }); });
  return t;
}

function olahDashboard(){
  var J = S.dsbData, r = S.dsbRentang, D = S.dsb;
  var buckets = daftarBucket(r);
  var H = hitungDsb(J, buckets);
  var areas = D.area ? [D.area] : S.master.area;
  var kini = kunciBucket(D.acuan), lalu = buckets[buckets.indexOf(kini)-1];
  var T = jumlahArea(H.A[kini], areas), TL = lalu ? jumlahArea(H.A[lalu], areas) : null;
  var namaPer = labelBucket(kini);
  var namaLalu = lalu ? labelBucket(lalu) : '';
  var adaM2 = buckets.some(function(b){ return areas.some(function(a){ return H.A[b][a].aM2 || H.A[b][a].rM2; }); });
  var adaM3 = buckets.some(function(b){ return areas.some(function(a){ return H.A[b][a].aM3 || H.A[b][a].rM3; }); });
  var adaB = buckets.some(function(b){ return areas.some(function(a){ return H.A[b][a].aB; }); });

  function delta(kini, lalu, sat){
    if(lalu===null || lalu===undefined) return '';
    var d = kini - lalu;
    return '<small style="color:'+(d>=0?'var(--hijau)':'var(--merah)')+'">'+(d>=0?'▲ ':'▼ ')+f1(Math.abs(d))+(sat||'')+' vs '+namaLalu+'</small>';
  }
  var pM = persen(T.aM, T.rM), pAbs = persen(T.manual, T.keb);
  var targetFoto = (J.batasFoto||5) * T.nHari;
  var kpi =

      (c.aM3||c.rM3 ? '<div style="margin-top:6px"><span class="mini">Box</span> <b>'+f1(c.aM3)+'</b> / '+f1(c.rM3)+' m³</div>' : '')+
      (c.aB ? '<div style="margin-top:6px"><span class="mini">Bongkar saja</span> <b>'+f1(c.aB)+'</b> m</div>' : '')+

        '<div><b>'+(c.finger||'—')+'</b><span>finger</span></div>'+
        '<div><b style="color:'+warnaPersen(pa)+'">'+(c.keb||'—')+'</b><span>kebutuhan</span></div>'+
      '</div>'+
      '<div class="mini" style="margin-top:6px">Laporan <b>'+c.lap+'</b> · foto <b>'+c.foto+'</b> · '+c.nHari+' hari kerja tercatat</div>'+

  }).join('')+'</div>';

  // tabel rekap per periode
  var baris = buckets.slice().reverse().map(function(b){
    var t = jumlahArea(H.A[b], areas), p = persen(t.aM, t.rM);
    return '<tr'+(b===kini?' style="background:#FDF6E3"':'')+'><td><b>'+labelBucket(b)+'</b></td>'+
      '<td class="angka">'+f1(t.rM)+'</td><td class="angka"><b>'+f1(t.aM)+'</b></td>'+
      '<td class="angka" style="color:'+(t.aM-t.rM<0?'var(--merah)':'var(--hijau)')+'">'+(t.aM-t.rM>=0?'+':'')+f1(t.aM-t.rM)+'</td>'+

      (adaM3?'<td class="angka">'+f1(t.aM3)+'</td>':'')+
      (adaB?'<td class="angka">'+f1(t.aB)+'</td>':'')+
